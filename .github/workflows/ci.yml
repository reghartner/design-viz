name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    # The single-worker browser suite takes about 34 minutes; allow setup and reporting headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/browser-tests/package-lock.json
            apps/backstage/package-lock.json
            apps/confluence/package-lock.json
      - run: npm ci --prefix tools/browser-tests --no-fund --no-audit
      - run: npm ci --prefix apps/backstage --no-fund --no-audit
      - run: npm ci --prefix apps/confluence --no-fund --no-audit
      - name: Install the pinned Playwright Chromium and Linux dependencies
        run: npm exec --prefix tools/browser-tests -- playwright install --with-deps chromium
      - name: Required browser contracts (no retries or missing-browser skips)
        run: npm test --prefix tools/browser-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-contract-results
          path: |
            tools/browser-tests/playwright-report/
            tools/browser-tests/test-results/
            tools/browser-tests/report.json
          if-no-files-found: ignore
          retention-days: 14

  backstage-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 tools/build.py --runtime-only
      - run: node --test examples/backstage-e2e/tests/*.test.mjs

  catalog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/catalog-sync/package-lock.json
      - run: npm ci --prefix tools/catalog-sync --ignore-scripts --no-fund --no-audit
      - run: python3 tools/build.py --runtime-only
      - run: npm test --prefix tools/catalog-sync

  backstage-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backstage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backstage/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run check:viewer
      - run: npm run verify
      - run: node --test ../../tests/canon-bundle.test.mjs
      - run: node ../../tools/verify-backstage-package.mjs
      - run: git diff --exit-code
      - name: Pack the reviewed release without rebuilding on install
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
      - uses: actions/upload-artifact@v4
        with:
          name: backstage-plugin-package
          path: apps/backstage/release/*.tgz
          if-no-files-found: error

  confluence-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/confluence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/confluence/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: confluence-viewer-assets
          path: apps/confluence/static/viewer/

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild HTML before tests
        run: python3 tools/build.py
      - run: python3 -m unittest discover -s tests -v

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild HTML before tests
        run: python3 tools/build.py
      # *.test.js glob keeps local (any node >=20) and CI invocations identical;
      # a bare directory arg behaves differently across node majors.
      - run: node --test tests/*.test.js

  examples-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate HTML and backend runtime from source
        run: python3 tools/build.py
      - name: example pages inject cleanly
        run: |
          python3 tools/inject.py examples/cumulus/cumulus-page.spec.v2.json template/flowview.html /tmp/cumulus.html
          python3 tools/inject.py examples/doorbell/doorbell.spec.json template/flowview.html /tmp/doorbell.html
          grep -q "403 Forbidden" /tmp/cumulus.html
          grep -q "person-at-door-night" /tmp/doorbell.html
      - name: example specs validate clean (CLI)
        run: |
          node tools/validate.js --quiet \
            examples/cumulus/cumulus-page.spec.json \
            examples/cumulus/cumulus-page.spec.v2.json \
            examples/doorbell/doorbell.spec.json \
            examples/doorbell-atlas/atlas.spec.json

      - name: Generated outputs stay out of Git
        run: node tools/check-generated.mjs --tracking-only
      - name: Builds leave tracked files unchanged
        run: git diff --exit-code
      - name: Build and smoke-test the source-based nginx image
        run: |
          docker build -f deploy/workbench/Dockerfile -t flowview-workbench .
          docker run -d --name flowview-workbench-test -p 8080:80 flowview-workbench
          trap 'docker rm -f flowview-workbench-test' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 -fsSL http://localhost:8080/ -o /tmp/workbench.html
          grep -q 'id="workbench-welcome"' /tmp/workbench.html
          grep -q 'id="flowview-folder-kit"' /tmp/workbench.html
          curl -fsS http://localhost:8080/template/flowview.html -o /tmp/viewer.html
          cmp /tmp/viewer.html template/flowview.html
          curl -fsS http://localhost:8080/workbench/catalog.json -o /tmp/catalog.json
          cmp /tmp/catalog.json workbench/catalog.json
      - name: Upload portable viewer and workbench
        uses: actions/upload-artifact@v4
        with:
          name: flowview-html
          path: |
            LICENSE
            template/flowview.html
            workbench/flowspec.html
            workbench/catalog.json
            workbench/diagrams.json
            src/starters/
            canon.json
            diagrams/
          if-no-files-found: error
          retention-days: 30
