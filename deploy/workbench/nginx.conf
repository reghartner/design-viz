server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = / { return 302 /workbench/flowspec.html; }
    location = /workbench/catalog.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / { try_files $uri =404; }
}
