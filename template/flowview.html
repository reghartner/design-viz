.stepmode .coin:not(.lit){opacity:var(--dv-dim, .4);}
.stepmode .grpbox, .stepmode .grptitle, .stepmode .grpicon{opacity:.55;}
.sk-aurora .stepmode .node.lit .card{stroke:#3E9FC4;}
.sk-aurora .stepmode .coin.lit circle{stroke:#8AE8FF;}
.sk-daylight .stepmode .node.lit .card{stroke:#4956C9;}
.sk-daylight .stepmode .coin.lit circle{fill:#2F3AA0;}

.termbar{position:relative; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  border-radius:0 0 12px 12px; border:1px solid color-mix(in srgb, var(--acc) 30%, transparent); border-top:0;}
.sk-aurora .termbar{background:#0B1220; border-top:1px dashed #25364F;}
.termbar[hidden]{display:none;}
.sk-daylight .termbar{background:#FBFAF6; border-top:1px dashed #E0DCD1;}
.tbtn{font:600 12px 'IBM Plex Mono',monospace; padding:5px 11px; border-radius:7px; cursor:pointer;}
.sk-aurora .tbtn{background:#141A21; border:1px solid #2A343F; color:#9FB0BF;}
.sk-aurora .tbtn:hover{border-color:#38E1FF; color:#8AE8FF;}
.sk-daylight .tbtn{background:#FFFFFF; border:1px solid #E0DCD1; color:#6B6F7A;}
.sk-daylight .tbtn:hover{border-color:#4956C9; color:#4956C9;}
.schips{display:flex; gap:5px; flex-wrap:wrap;}
.step-transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;}
.step-transport .tbtn{min-width:34px;min-height:34px;}
.step-transport .playback-button{min-width:88px;white-space:nowrap;}
.step-transport .tbtn:disabled{opacity:.45;cursor:default;}
.playback-status{display:inline-flex;align-items:center;gap:6px;margin-left:4px;font:600 12px 'IBM Plex Mono',monospace;color:var(--dink);white-space:nowrap;}
.playback-status::before{content:'';width:7px;height:7px;border:1px solid currentColor;border-radius:50%;box-sizing:border-box;}
[data-playback="playing"] .playback-status::before{background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 15%,transparent);}
[data-playback="playing"] .playback-button{box-shadow:inset 0 -2px currentColor;}
@media(max-width:640px){.step-transport .tbtn{min-width:44px;min-height:44px;}}
.schip{font:700 11px 'IBM Plex Mono',monospace; width:26px; height:26px; border-radius:7px; cursor:pointer; padding:0;}
.dvdelta{fill:var(--delta); stroke:rgba(0,0,0,.4); stroke-width:1; pointer-events:none;}
.schip.dvd{position:relative;}
.schip.dvd::after{content:''; border-left:4px solid transparent; border-right:4px solid transparent;
  border-bottom:7px solid var(--delta); position:absolute; top:-3px; right:-3px; pointer-events:none;}
/* Delta-only wins over each skin's inactive-step opacity rules. */
.dv-deltaonly g.node:not(.dvd):not(.lit),
.dv-deltaonly path.edge:not(.dvd):not(.lit),
.dv-deltaonly path.halo:not(.dvd):not(.lit),
.dv-deltaonly text.lbl:not(.dvd):not(.lit),
.dv-deltaonly g.coin:not(.dvd):not(.lit),
.dv-deltaonly circle.loopdot:not(.dvd){opacity:.18 !important;}
.dv-deltaonly .dvd, .dv-deltaonly .dvdelta, .dv-deltaonly .lit{opacity:1 !important;}
.termbar.dv-deltaonly .schip:not(.dvd):not([aria-current="true"]){opacity:.35 !important;}
.termbar.dv-deltaonly .schip[aria-current="true"]{opacity:1 !important;}
@media (prefers-reduced-motion: no-preference){
  .dv-deltaonly g.node, .dv-deltaonly path.edge, .dv-deltaonly path.halo,
  .dv-deltaonly text.lbl, .dv-deltaonly g.coin, .dv-deltaonly circle.loopdot,
  .termbar.dv-deltaonly .schip{transition:opacity .25s !important;}
}
.sk-aurora .schip{background:#141A21; border:1px solid #2A343F; color:#6E7B8A;}
.sk-aurora .schip[aria-current="true"]{border-color:#38E1FF; color:#8AE8FF; background:#0C2230;}
.sk-daylight .schip{background:#FFFFFF; border:1px solid #E0DCD1; color:#6B6F7A;}
.sk-daylight .schip[aria-current="true"]{border-color:#4956C9; color:#4956C9; background:#EEF0FB;}
.stepline{font:500 12px 'IBM Plex Mono',monospace; min-width:200px; flex:1;}
.sk-aurora .stepline{color:#A9C4D9;}
.sk-daylight .stepline{color:#4A4F58;}
.stepline b{font-weight:700; margin-right:8px;}
.sk-aurora .stepline b{color:#8AE8FF;}
.sk-daylight .stepline b{color:#4956C9;}
.stepline.dv-caption-old{position:absolute;z-index:2;pointer-events:none;box-sizing:border-box;
  animation:dvcaptionold .4s ease both;}
.stepline.dv-caption-new{animation:dvcaptionnew .4s ease both;}
@keyframes dvcaptionold{from{opacity:1;}to{opacity:0;}}
@keyframes dvcaptionnew{from{opacity:0;}to{opacity:1;}}

@media (prefers-reduced-motion: reduce){
  .edge{animation:none !important;}
  .pkt{display:none;}
  .leddot, .recdot, .screenbox .walker, .screenbox .flick{animation:none !important;}
  .screenbox .courier, .screenbox .courier .carried, .screenbox .pkg{animation:none !important;}
  .screenbox .walker{transform:translateX(160px);}
  .odot.cur{animation:none !important;}
  .wfrow, .wfbar, .odot, .pchip{transition:none !important;animation:none !important;}
  .dv-step-tween .edge, .dv-step-tween .lbl, .dv-step-tween .node, .dv-step-tween .coin,
  .dv-step-tween .node .card, .dv-step-tween .coin circle,
  .dv-step-tween .node .t1, .node.tone-pulse .card,
  .stepline.dv-caption-old, .stepline.dv-caption-new{transition:none !important;animation:none !important;}
  .gaugefill, .ifbar{transition:none !important;}
  .phonecard.fresh{animation:none !important;}
  .qmsg{animation:none !important;} /* chip rests static in the slot; arrows + caption carry the state */
  .pircone, .pirsweep, .pirping, .pirghost, .pirtrail, .pirripple, .pirstatusbg{animation:none !important;}
  .pirsubject{transition:none !important;}
  .thfill{transition:none !important;}
  .thzone.z-crit, .thdot.cur.z-crit{animation:none !important;}
  .btfill{transition:none !important;}
  .btzone.z-crit, .btdot.cur.z-crit{animation:none !important;}
  .bfmark.on, .bfcell.s-uploading{animation:none !important;}
  .rdsweep, .rdripple, .rdstatusbg{animation:none !important;}
  .hmsweep,.hmripple,.hmglow,.hmsig,.hmtxring{animation:none !important; display:none !important;}
  .hmrecdot{animation:none !important;}
  .rdsubject,.hmsubject{transition:none !important;}
  .sgrow.s-retrying .sgbar.on, .sgrow.s-jammed .sgstate{animation:none !important;}
  .prosechev{transition:none !important;}
}

/* ---------- print (C4): light ground, no motion, no controls, all tabs,
   numbered step captions under each board ---------- */
@media print{
  body{background:#FFFFFF !important;}
  .docview{max-width:none; padding:0;}
  .docview{--dtext:#333333; --dink:#111111; --dfaint:#555555;}
  .generated-from{color:#555555; break-after:avoid;}
  .generated-from a{color:#333333 !important; text-decoration:underline;}
  .doc-sec{background:#FFFFFF; border-color:#BBBBBB; break-inside:avoid; margin-top:14px;}
  .sec-eyebrow{color:#555555;}
  .tabbar, .mtoggle, .termbar, .presentbtn, .srcchip, .copychip, .prosetoggle, .nlink, .nbackref, .nbackpop, .ctlink{display:none !important;}
  .sec-prose[hidden]{display:block !important;}
  .sec-prose{height:auto !important; opacity:1 !important; overflow:visible !important;}
  .sec-teaser{display:none !important;} /* print expands the prose, so the teaser dupes it */
  .tabpanel[hidden]{display:block !important;}
  .board{--dv-board-ground:#FFFFFF !important; border-color:#CCCCCC; overflow:visible;}
  .board svg{min-width:0;}
  .board svg > rect:first-of-type{fill:#FFFFFF;}
  .board svg > rect[fill^="url"]{display:none;}
  .lg{background:#FFFFFF; border-bottom-color:#DDDDDD;}
  .lg .li{color:#444444 !important;}
  .sk-aurora .t1, .sk-daylight .t1{fill:#111111;}
  .sk-aurora .t2, .sk-daylight .t2{fill:#555555;}
  .sk-aurora .lbl, .sk-daylight .lbl{fill:#444444;}
  .sk-aurora .card, .sk-daylight .card{fill:#FFFFFF; stroke:#999999; filter:none;}
  .sk-aurora .coin circle, .sk-daylight .coin circle{fill:#FFFFFF; stroke:#555555;}
  .sk-aurora .coin text, .sk-daylight .coin text{fill:#333333;}
  .sk-aurora .grpbox, .sk-daylight .grpbox{stroke:#999999; fill:none;}
  .sk-aurora .grptitle, .sk-daylight .grptitle{fill:#666666;}
  .sk-aurora .grpicon, .sk-daylight .grpicon{color:#666666;}
  .edge{animation:none !important;}
  .pkt, .halo{display:none !important;}
  /* per-step panel state is ambiguous on paper, so widgets are hidden — EXCEPT
     queue and phone, whose folded states print statically. A panel column with
     neither collapses entirely (:has-capable print engines; harmless otherwise). */
  .panelcol .pwidget{display:none !important;}
  .panelcol .pwidget.pt-queue,
  .panelcol .pwidget.pt-phone{display:block !important; background:#FFFFFF; border-color:#BBBBBB;}
  .panelcol:not(:has(.pt-queue)):not(:has(.pt-phone)){display:none;}
  .pt-queue .ptitle{color:#555555;}
  .qmsg{animation:none !important; background:#FFFFFF; color:#111111; border-color:#555555;}
  .qslot{border-color:#999999;}
  .qempty, .qstatecap{color:#555555; opacity:.8;}
  .qreason, .qside{color:#555555;}
  .qarr{color:#777777;}
  .phoneframe{color:#222222 !important;background:#FFFFFF !important;border-color:#555555 !important;
    box-shadow:inset 0 0 0 2px #EEEEEE !important;break-inside:avoid;}
  .phonespeaker,.phonehome,.phonesignal i{background:#555555 !important;}
  .phonebattery{color:#555555 !important;border-color:#555555 !important;}
  .phonecard{color:#222222 !important;background:#F4F4F4 !important;border-color:#BBBBBB !important;box-shadow:none !important;}
  .phoneapp,.phoneoverflow,.phonetext{color:#555555 !important;}
  .phonebadge{color:#FFFFFF !important;background:#333333 !important;}
  .phonecard.fresh{animation:none !important;}
  .ctcard{background:#FFFFFF; border-color:#BBBBBB; break-inside:avoid;}
  .cttitle{color:#555555;}
  .ctk, .ctrow.hot .ctk{color:#111111;}
  .ctv{color:#333333;}
  .ctg, .ctnote{color:#555555;}
  .sk-aurora .ctrow td, .sk-daylight .ctrow td{border-top-color:#DDDDDD;}
  .sk-aurora .ctrow.hot td, .sk-daylight .ctrow.hot td{background:#F2F2F2;}
  .printsteps{display:block; font:500 11px/1.6 'IBM Plex Mono',monospace; color:#333333;
    margin:8px 0 0; padding-left:22px;}
  .printsteps li{margin:2px 0;}
}

/* ---------- editorial skin (Aurora overlay) ---------- */
/* Daylight editorial — cascade-only visual restyle. */
body.sk-editorial{
  --ed-paper:#F3EEE4;
  --ed-sheet:#FBF8F1;
  --ed-soft:#EDE6DA;
  --ed-ink:#1E2927;
  --ed-text:#35423F;
  --ed-muted:#5D625D;
  --ed-rule:#D6CCBC;
  --ed-rule-strong:#B8AC9B;
  --ed-accent:#0E5B56;
  --ed-accent-deep:#084641;
  --ed-accent-soft:#E1EDEA;
  --ed-good:#24734E;
  --ed-warn:#986318;
  --ed-bad:#A33A31;
}

body.sk-editorial,
body.sk-editorial.sk-aurora,
body.sk-editorial.sk-daylight{
  color:var(--ed-text);
  background:
    linear-gradient(90deg, rgba(14,91,86,.035) 1px, transparent 1px) 50% 0/120px 100%,
    var(--ed-paper);

}

body.sk-editorial .docview,
body.sk-editorial .docview.sk-aurora,
body.sk-editorial .docview.sk-daylight{

  padding:58px 42px 88px;
}

body.sk-editorial .doc-title{
  max-width:900px;
  margin:0;
  color:var(--ed-ink);

  letter-spacing:-.035em;

}
body.sk-editorial .doc-sub{
  margin:18px 0 0;

  letter-spacing:.13em;
  text-transform:uppercase;
}

  content:"";

body.sk-editorial .generated-from{color:var(--ed-muted);}

body.sk-editorial .sk-daylight .steplink,

body.sk-editorial .sk-aurora .nlink text,

body.sk-editorial .sk-daylight .ilink:hover,
body.sk-editorial .sk-aurora .steplink:hover,
body.sk-editorial .sk-daylight .steplink:hover,
body.sk-editorial .sk-aurora .ctlink:hover,
body.sk-editorial .sk-daylight .ctlink:hover,

body.sk-editorial .sk-aurora .mbtn,
body.sk-editorial .sk-daylight .mbtn,
body.sk-editorial .sk-aurora .tbtn,
body.sk-editorial .sk-daylight .tbtn,

/* ---------- per-step semantic node tones ----------
   Narrative state is a class on the node group; authored specs never supply
   these colors. Tone owns the card/title hue; step focus composes a stronger
   tone-colored outline and halo without replacing that hue. */
.node.tone-pulse .card{transform-box:fill-box;transform-origin:center;animation:dvnodepulse .64s ease-out;}
@keyframes dvnodepulse{
  0%{transform:scale(1);}
  36%{transform:scale(1.035);stroke-width:2.8;}
  100%{transform:scale(1);}
}

          warnings.push(PP + '.rings: expected a count 1–6 or an array of distances — using 3');
        } else if (p.rings < 1 || p.rings > 6){
          warnings.push(PP + '.rings: count out of range — clamped to 1–6');
        }
      }
      if (p.scale != null && !(p.scale && isFiniteNum(p.scale.pxPerUnit) && p.scale.pxPerUnit > 0))
        warnings.push(PP + '.scale: expected {pxPerUnit: <positive number>, unit: "<name>"} — scaling disabled; polar r values render as raw pixels');
      if (p.zones != null){
        if (!Array.isArray(p.zones))
          warnings.push(PP + '.zones: must be an array of {id, label, points} — ignored');
        else p.zones.forEach(function(z, zi){
          var poly = z && Array.isArray(z.points) && z.points.length >= 3;
          var sector = z && Array.isArray(z.r) && z.r.length === 2 &&
                       Array.isArray(z.deg) && z.deg.length === 2;
          if (!z || !z.id || (!poly && !sector)){
            warnings.push(PP + '.zones[' + zi + ']: needs {id, points:[[x,y]…] with 3+ points} or {id, r:[r0,r1], deg:[d0,d1]} — zone skipped');
          } else if (sector && !poly){
            var secOk = isFiniteNum(z.r[0]) && isFiniteNum(z.r[1]) && z.r[0] >= 0 && z.r[1] > z.r[0] &&
                        isFiniteNum(z.deg[0]) && isFiniteNum(z.deg[1]);
            if (!secOk)
              warnings.push(PP + '.zones[' + zi + ']: sector needs finite 0 <= r0 < r1 and finite degrees — zone skipped');
            else if (z.deg[0] === z.deg[1])
              warnings.push(PP + '.zones[' + zi + ']: sector with equal start and end degrees is degenerate — zone skipped (a full circle is deg:[0,360])');
          }
        });
      }
    }
    if (p.type === 'buffer'){
      bufferPanels[p.id] = true;
      if (p.segments != null){
        if (!isFiniteNum(p.segments))
          warnings.push(PP + '.segments: expected a number 2–48 — using 12');
        else if (p.segments < 2 || p.segments > 48)
          warnings.push(PP + '.segments: out of range — clamped to 2–48');
      }
      bufferCellWarnings(p.initial, PP + '.initial', p, warnings);
    }
  });
  var stepIds = {};
  (d.steps || []).forEach(function(st, ti){
    if (st && Object.prototype.hasOwnProperty.call(st, 'delta') && typeof st.delta !== 'boolean')
      warnings.push(DP + '.steps[' + ti + '].delta: must be true or false — ignored');
    var keys = stepKeys(st);
    var failures = stepFailures(st);
    if (st && st.failures != null){
      var FP = DP + '.steps[' + ti + '].failures';
      if (typeof st.failures !== 'object' || Array.isArray(st.failures)) errors.push(FP + ': expected an object mapping edge keys to dropped or blocked');
      else Object.keys(st.failures).forEach(function(key){
        if (!Object.prototype.hasOwnProperty.call(edgeKeys,key)) errors.push(FP + ': unknown edge \"' + key + '\" (format from->to)');
        if (COMM_FAILURE_MODES.indexOf(st.failures[key]) < 0) errors.push(FP + '.' + key + ': expected dropped or blocked');
      });
    }
    var nds = stepNodes(st);
    var patch = stepPanelPatch(st);
    var tonePatch = stepTonePatch(st);
    var hasToneField = !!(st && Object.prototype.hasOwnProperty.call(st, 'tone'));
    if (st && st.id != null){
      if (typeof st.id !== 'string')
        warnings.push(DP + '.steps[' + ti + '].id: must be a string — ignored');
      else if (stepIds[st.id])
        warnings.push(DP + '.steps[' + ti + '].id: duplicate step id "' + st.id + '" — deep links resolve to the first');
      else stepIds[st.id] = true;
    }
    if (!keys.length && !Object.keys(failures).length && !nds.length && !patch && !tonePatch)
      warnings.push(DP + '.steps[' + ti + ']: no edge/edges, nodes, or panels, or tone — give it something to show');
    keys.forEach(function(k){
      if (!edgeKeys[k]) warnings.push(DP + '.steps[' + ti + ']: "' + k + '" matches no edge (format "from->to") — skipped');
    });
    nds.forEach(function(id){
      if (!placed[id]) warnings.push(DP + '.steps[' + ti + '].nodes: "' + id + '" is not a placed node — skipped');
    });
    if (hasToneField && !tonePatch){
      warnings.push(DP + '.steps[' + ti + '].tone: must be an object mapping node ids to tone tokens — ignored (valid: ' +
        TONE_SET.join(' ') + '; null also clears)');
    } else if (tonePatch){
      Object.keys(tonePatch).forEach(function(id){
        var tone = tonePatch[id];
        if (!d.nodes[id]){
          warnings.push(DP + '.steps[' + ti + '].tone: unknown node id "' + id + '" — tone ignored');
        } else if (tone !== null && TONE_SET.indexOf(tone) < 0){
          warnings.push(DP + '.steps[' + ti + '].tone.' + id + ': unknown tone token "' +
            String(tone) + '" — ignored (valid: ' + TONE_SET.join(' ') + '; null also clears)');
        }
      });
    }
    if (patch) Object.keys(patch).forEach(function(pid){
      if (!panelIds[pid]){
        warnings.push(DP + '.steps[' + ti + '].panels: "' + pid + '" is not a declared panel id — patch ignored');
      } else if (patch[pid] == null || typeof patch[pid] !== 'object' || Array.isArray(patch[pid])){
        // a patch must be an object of widget fields — a bare array/scalar is
        // silently ignored by the engine (classic slip: log lines given as
        // panels.<id>: [...] instead of panels.<id>: {"log": [...]})
        warnings.push(DP + '.steps[' + ti + '].panels.' + pid + ': patch must be an object of widget fields — ' +
          (Array.isArray(patch[pid]) ? 'got an array (log lines go in {"log": [...]})' : 'got ' + typeof patch[pid]) +
          '; the engine ignores this patch');
      } else if (panelDeclById[pid] && panelDeclById[pid].type === 'screen'){
        screenPatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, warnings);
      } else if (queuePanels[pid] && patch[pid]){
        if (patch[pid].state != null && QUEUE_STATES.indexOf(String(patch[pid].state)) < 0)
          warnings.push(DP + '.steps[' + ti + '].panels.' + pid + '.state: unknown queue state "' +
            patch[pid].state + '" — using "empty" (valid: ' + QUEUE_STATES.join(' ') + ')');
        queueContextWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, warnings);
      } else if (thermoPanels[pid] && patch[pid] && patch[pid].value != null && !isFiniteNum(patch[pid].value)){
        warnings.push(DP + '.steps[' + ti + '].panels.' + pid +
          '.value: must be a finite number — rendered as NO DATA');
      } else if (batteryPanels[pid] && patch[pid] && patch[pid].charge != null && !isFiniteNum(patch[pid].charge)){
        warnings.push(DP + '.steps[' + ti + '].panels.' + pid +
          '.charge: must be a finite number — rendered as NO DATA');
      } else if (bufferPanels[pid] && patch[pid]){
        bufferCellWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, panelDeclById[pid], warnings);
      } else if (signalPanels[pid] && patch[pid]){
        signalLinkWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, warnings);
      } else if (tilesPanels[pid] && patch[pid]){
        tileStateWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, tilesPanels[pid], warnings);
      } else if (homemapPanels[pid] && patch[pid]){
        homemapPatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, homemapPanels[pid], warnings);
      } else if (radarPanels[pid] && patch[pid]){
        radarPatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, warnings);
      } else if (inflightPanels[pid] && patch[pid]){
        inflightPatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid,
          inflightPanels[pid], warnings);
      } else if (phonePanels[pid] && patch[pid]){
        phonePatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, warnings);
      } else if (timelinePanels[pid] && patch[pid]){
        timelinePatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, panelDeclById[pid], warnings);
      } else if (panelDeclById[pid].type === 'trace'){
        tracePanelPatchWarnings(patch[pid],DP+'.steps['+ti+'].panels.'+pid,panelDeclById[pid],warnings);
      } else if (panelDeclById[pid].type === 'replicas'){
        replicaPatchWarnings(patch[pid],DP+'.steps['+ti+'].panels.'+pid,panelDeclById[pid],warnings);
      } else if (['table','checks','budget'].indexOf(panelDeclById[pid].type) >= 0){
        softwarePanelPatchWarnings(patch[pid], DP + '.steps[' + ti + '].panels.' + pid, panelDeclById[pid], warnings);
      }
    });
    if (st && st.lane && !lanes[st.lane])
      warnings.push(DP + '.steps[' + ti + '].lane: lane "' + st.lane + '" not declared in page.lanes — neutral pill');
    if (st && st.link && typeof st.link !== 'string') warnings.push(DP + '.steps[' + ti + '].link: must be a URL string — link ignored');
    if (st && Array.isArray(st.packets)) st.packets.forEach(function(pk, ki){
      if (!pk || !edgeKeys[pk.edge]) warnings.push(DP + '.steps[' + ti + '].packets[' + ki + ']: "' + (pk && pk.edge) + '" matches no edge — skipped');
    });
  });
}

function validate(page){
  var errors = [], warnings = [];
  if (!page){ errors.push('top level: expected {page:{blocks:[...]}} (or sections), or a bare diagram with nodes+rows'); return {errors:errors, warnings:warnings}; }
  if (typeof FlowCanon !== 'undefined') errors = errors.concat(FlowCanon.validate(page));
  var blocks = blocksOf(page);
  if (!blocks.length){
    errors.push('page.blocks: required — provide at least one section or tabs block');
    return {errors:errors, warnings:warnings};
  }
  if (page.skin && SKIN_NAMES.indexOf(page.skin) < 0)
    warnings.push('page.skin: unknown skin "' + page.skin + '" — using "aurora" (valid: ' + SKIN_NAMES.join(', ') + ')');
  if (Object.prototype.hasOwnProperty.call(page, 'generatedFrom')){
    var gf = page.generatedFrom;
    if (!gf || typeof gf !== 'object' || Array.isArray(gf)){
      warnings.push('page.generatedFrom: must be an object {url, label?, version?, at?} — provenance line skipped');
    } else {
      ['url', 'label', 'version', 'at'].forEach(function(k){
        if (Object.prototype.hasOwnProperty.call(gf, k) && typeof gf[k] !== 'string')
          warnings.push('page.generatedFrom.' + k + ': must be a string — ' +
            (k === 'url' ? 'provenance line skipped' : 'value ignored'));
      });
      if (!Object.prototype.hasOwnProperty.call(gf, 'url')){
        warnings.push('page.generatedFrom.url: required — provenance line skipped');
      } else if (typeof gf.url === 'string' && !/^https?:\/\//i.test(gf.url)){
        warnings.push('page.generatedFrom.url: only http(s) URLs become links — label rendered as text');
      }
    }
  }
  if (page.contract != null){
    var major = String(page.contract).split('.')[0];
    if (major !== CONTRACT_VERSION)
      warnings.push('page.contract: spec declares contract "' + page.contract +
        '" — this engine implements contract ' + CONTRACT_VERSION +
        '; rendering proceeds but re-check the spec against the current authoring contract');
  }
  var protos = resolveProtocols(page);
  var lanes = resolveLanes(page);
  blocks.forEach(function(b){
    if (b.type === 'section'){
      validateSection(b.sec, b.path, protos, lanes, errors, warnings);
    } else {
      if (!b.tabs.length) warnings.push(b.path + '.tabs: empty tabs block');
      b.tabs.forEach(function(t){
        if (!t.sections.length) warnings.push(t.path + '.sections: tab has no sections');
        t.sections.forEach(function(sec, k){
          validateSection(sec, t.path + '.sections[' + k + ']', protos, lanes, errors, warnings);
        });
      });
    }
  });
  return {errors:errors, warnings:warnings};
}

/* ---------------- node-tone folding ----------------
   Like panel patches, node tones are sparse authoring deltas folded into
   absolute per-step snapshots. Unknown ids/tokens are ignored here (the
   validator warns); `base` and null delete the carried tone. */
function foldNodeTones(d){
  d = d || {};
  var nodes = d.nodes || {};
  var steps = Array.isArray(d.steps) ? d.steps : [];
  var carried = {}, states = [];
  steps.forEach(function(st){
    var patch = stepTonePatch(st);
    if (patch) Object.keys(patch).forEach(function(id){
      if (!Object.prototype.hasOwnProperty.call(nodes, id)) return;
      var tone = patch[id];
      if (tone === null || tone === 'base'){
        delete carried[id];
      } else if (TONE_SET.indexOf(tone) >= 0 && tone !== 'base'){
        carried[id] = tone;
      }
    });
    var snap = {};
    Object.keys(carried).forEach(function(id){ snap[id] = carried[id]; });
    states.push(snap);
  });
  if (!steps.length) states.push({});
  return states;
}

/* ---------------- panel-state folding ----------------
   Authors emit sparse per-step patches; we fold them into COMPLETE state per
   step at load time, so any step jump renders from absolute state, never
   deltas. Rules:
   - state N = shallow merge of state N-1 and step N's patch for that panel;
   - a "log" patch key APPENDS (cumulative array of lines);
   - an "enterOnce" sub-object applies only at its own step (not carried). */
function foldInflightStates(panel, steps){
  panel = panel || {};
  steps = Array.isArray(steps) ? steps : [];
  var lanes = {};
  (Array.isArray(panel.lanes) ? panel.lanes : []).slice(0, 8).forEach(function(l){
    if (l && l.id && !lanes[l.id]) lanes[l.id] = true;
  });
  var bars = [], open = {}, states = [];
  function cloneBars(){
    return bars.map(function(b){
      return {lane:b.lane, label:b.label, start:b.start, end:b.end, state:b.state};
    });
  }
  steps.forEach(function(st, stepIdx){
    var all = stepPanelPatch(st) || {};
    var patch = all[panel.id];
    patch = patch && typeof patch === 'object' && !Array.isArray(patch) ? patch : {};
    (Array.isArray(patch.start) ? patch.start : []).forEach(function(op){
      if (!op || typeof op !== 'object' || !lanes[op.lane]) return;
      if (open[op.lane] != null) bars[open[op.lane]].end = stepIdx;
      var bar = {lane:op.lane,
                 label:op.label != null ? String(op.label) : '',
                 start:stepIdx, end:null, state:'ok'};
      bars.push(bar);
      open[op.lane] = bars.length - 1;
    });
    (Array.isArray(patch.end) ? patch.end : []).forEach(function(lane){
      if (!lanes[lane] || open[lane] == null) return;
      bars[open[lane]].end = stepIdx;
      delete open[lane];
    });
    (Array.isArray(patch.mark) ? patch.mark : []).forEach(function(op){
      if (!op || typeof op !== 'object' || !lanes[op.lane] || open[op.lane] == null) return;
      bars[open[op.lane]].state = INFLIGHT_STATES.indexOf(op.state) >= 0 ? op.state : 'ok';
    });
    states.push({bars:cloneBars(), currentStep:stepIdx, stepCount:steps.length});
  });
  if (!steps.length) states.push({bars:[], currentStep:0, stepCount:0});
  return states;
}

/* Fold phone operations into absolute snapshots. The complete unread stack
   is retained newest-step-first; a single step's array keeps authored order.
   `_phoneAdded` is presentation metadata for the one-shot newest-card cue and
   is recomputed per target step, never carried. */
function foldPhoneStates(panel, steps){
  panel = panel || {};
  steps = Array.isArray(steps) ? steps : [];
  var clock = '', notifications = [], states = [];
  function validNotification(n){
    return n && typeof n === 'object' && !Array.isArray(n) &&
      typeof n.app === 'string' && !!n.app;
  }
  function cleanNotification(n){
    return {app:n.app,
      title:typeof n.title === 'string' ? n.title : '',
      text:typeof n.text === 'string' ? n.text : ''};
  }
  function apply(patch){
    patch = patch && typeof patch === 'object' && !Array.isArray(patch) ? patch : {};
    if (typeof patch.clock === 'string') clock = patch.clock;
    if (patch.clear === true) notifications = [];
    if (!Object.prototype.hasOwnProperty.call(patch, 'notify')) return 0;
    var raw = Array.isArray(patch.notify) ? patch.notify : [patch.notify];
    var pushed = raw.filter(validNotification).map(cleanNotification);
    if (pushed.length) notifications = pushed.concat(notifications);
    return pushed.length;
  }
  apply(panel.initial);
  steps.forEach(function(st){
    var all = stepPanelPatch(st) || {};
    var added = apply(all[panel.id]);
    states.push({clock:clock, notifications:notifications.map(cleanNotification),
      _phoneAdded:added});
  });
  if (!steps.length)
    states.push({clock:clock, notifications:notifications.map(cleanNotification), _phoneAdded:0});
  return states;
}

/* Carry device states and subject positions; signals belong only to their authored step. */
function foldHomemapStates(panel, steps){
  var carried = Object.create(null), states = [], subjects = Object.create(null);
  homemapSubjects(panel).forEach(function(sub){ subjects[sub.id] = sub; });
  function apply(patch){
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return;
    Object.keys(patch).forEach(function(k){
      if (k === 'signals') return;
      if (subjects[k] && patch[k] !== null && !homemapSubjectPosition(patch[k])) return;
      carried[k] = patch[k];
    });
  }
  function snapshot(signals){
    var snap = Object.create(null);
    Object.keys(carried).forEach(function(k){ snap[k] = carried[k]; });
    snap.signals = Array.isArray(signals) ? signals.slice() : [];
    return snap;
  }
  apply(panel.initial);
  steps.forEach(function(st){
    var patch = (stepPanelPatch(st) || {})[panel.id];
    apply(patch);
    states.push(snapshot(patch && patch.signals));
  });
  if (!steps.length) states.push(snapshot(null));
  return states;
}

function foldPanelStates(d){
  var panels = d.panels || [];
  var steps = d.steps || [];
  var out = {};
  panels.forEach(function(p){
    if (!p || !p.id) return;
    if (p.type === 'homemap'){
      out[p.id] = foldHomemapStates(p, steps);
      return;
    }
    if (p.type === 'inflight'){
      out[p.id] = foldInflightStates(p, steps);
      return;
    }
    if (p.type === 'phone'){
      out[p.id] = foldPhoneStates(p, steps);
      return;
    }
    var carried = {};
    Object.keys(p.initial || {}).forEach(function(k){ carried[k] = p.initial[k]; });
    var logAcc = [];
    if (Array.isArray(carried.log)){ logAcc = carried.log.slice(); delete carried.log; }
    /* timeline events accumulate across steps like log lines */
    var eventAcc = null, missAcc = null;
    if (p.type === 'timeline'){
      eventAcc = Array.isArray(carried.events) ? carried.events.slice() : [];
      delete carried.events;
      missAcc = Array.isArray(carried.miss) ? carried.miss.slice() : [];
      delete carried.miss;
    }
    var states = [];
    steps.forEach(function(st){
      var patchAll = stepPanelPatch(st) || {};
      var patch = patchAll[p.id] || {};
      var once = null;
      /* a wholesale `cells` patch is a buffer RESET POINT: accumulated mark
         paints from earlier steps must not replay over it, so clear the
         accumulator first (marks in this same patch then apply on top) */
      if (patch.cells !== undefined) carried.mark = [];
      Object.keys(patch).forEach(function(k){
        if (k === 'enterOnce'){ once = patch[k]; return; }
        if (k === 'log'){
          var lines = Array.isArray(patch.log) ? patch.log : [patch.log];
          logAcc = logAcc.concat(lines);
          return;
        }
        if (k === 'events' && eventAcc !== null){
          var evs = Array.isArray(patch.events) ? patch.events : [patch.events];
          eventAcc = eventAcc.concat(evs);
          return;
        }
        if (k === 'miss' && missAcc !== null){
          var ms = Array.isArray(patch.miss) ? patch.miss : [patch.miss];
          missAcc = missAcc.concat(ms);
          return;
        }
        if (k === 'now' && eventAcc !== null){
          /* the validator promises "cursor unchanged" for unreadable
             times — honor it instead of wiping the carried cursor */
          if (parseClock(patch.now) != null) carried.now = patch.now;
          return;
        }
        if (k === 'mark'){
          /* buffer range-paints accumulate across steps (replayed in order
             at render), so any step jump repaints the full history. Long
             stories are COMPACTED: past 64 accumulated ops the paints are
             baked into a materialized cells array and the op list restarts,
             so retained size and replay work stay bounded. */
          var ops = Array.isArray(patch.mark) ? patch.mark : [];
          carried.mark = (Array.isArray(carried.mark) ? carried.mark : []).concat(ops);
          if (carried.mark.length > 64){
            var bn = bufferSegCount(p);
            carried.cells = bufferPaint(bn, carried.cells, carried.mark);
            carried.mark = [];
          }
          return;
        }
        carried[k] = patch[k];
      });
      var snap = {};
      Object.keys(carried).forEach(function(k){ snap[k] = carried[k]; });
      if (once) Object.keys(once).forEach(function(k){ snap[k] = once[k]; });
      if (eventAcc !== null) snap.events = eventAcc.slice();
      if (missAcc !== null) snap.miss = missAcc.slice();
      snap.log = logAcc.slice();
      states.push(snap);
    });
    if (!steps.length){
      var only = {};
      Object.keys(carried).forEach(function(k){ only[k] = carried[k]; });
      if (eventAcc !== null) only.events = eventAcc.slice();
      if (missAcc !== null) only.miss = missAcc.slice();
      only.log = logAcc.slice();
      states.push(only);
    }
    out[p.id] = states;
  });
  return out;
}

/* ---------------- lint (advisory warnings, never errors) ----------------
   Layout-aware heuristics for spec authors who cannot see the render — an
   authoring agent gets these from tools/validate.js before any browser is
   involved. Uses layout()/isWrap() from engine.js (same bundle; call time).
   Defensive: a diagram that fails basic validation is skipped, never thrown
   on. */
var LINT_CHAR_PX = 6.35;      /* mono label width estimate, px per char */
var LINT_CORRIDOR_MAX = 4;    /* cross-row edges per row gap before warning */

function lintDiagram(d, DP, usedKinds, warnings){
  if (!d || !d.nodes || typeof d.nodes !== 'object' ||
      !Array.isArray(d.rows) || !d.rows.length) return;
  (d.edges || []).forEach(function(e){
    if (e && e.kind) usedKinds[e.kind] = true;
  });
  var L;
  try { L = layout(d); } catch (ex){ return; }

  var corridor = {};
  (d.edges || []).forEach(function(e, ei){
    if (!e) return;
    var a = L.pos[e.from], b = L.pos[e.to];
    if (!a || !b) return;
    if (a.row >= 0 && b.row >= 0 && a.row !== b.row){
      var g = Math.min(a.row, b.row);
      corridor[g] = (corridor[g] || 0) + 1;
    }
    if (e.label){
      var chord = Math.sqrt(Math.pow(b.cx - a.cx, 2) + Math.pow(b.cy - a.cy, 2));
      var usable;
      if (isWrap(e, L)) usable = chord * 2.2;
      else if (a.row === b.row && a.row >= 0) usable = Math.max(30, chord - (a.w + b.w) / 2);
      else usable = chord * 1.25;
      var labelPx = String(e.label).length * LINT_CHAR_PX;
      if (labelPx > usable){
        var shown = String(e.label).length > 28 ? String(e.label).slice(0, 25) + '…' : String(e.label);
        warnings.push(DP + '.edges[' + ei + '].label: "' + shown + '" (~' + Math.round(labelPx) +
          'px) is longer than its edge can carry (~' + Math.round(usable) +
          'px) — shorten it, or the auto-layout will push it far off the line');
      }
    }
  });
  Object.keys(corridor).forEach(function(g){
    if (corridor[g] > LINT_CORRIDOR_MAX)
      warnings.push(DP + ': ' + corridor[g] + ' edges cross the corridor between rows ' +
        (Number(g) + 1) + ' and ' + (Number(g) + 2) +
        ' — expect crowding; consider fewer return edges or a second section');
  });

  var reportedPairs = new Set();
  diagramPathList(d).forEach(function(path){
    var firstEdgeAt = new Map();
    path.indices.forEach(function(ti){

         '<rect class="card" width="' + p.w + '" height="' + p.h + '" rx="12"/>' +
         '<rect class="icbg" x="12" y="' + (small?9:14) + '" width="26" height="26" rx="8"/>' +
         '<use href="#i-' + icon + '" x="17" y="' + (small?14:19) + '" width="16" height="16"/>' +
         '<text class="t1" x="46" y="' + (small?22:25) + '">' + esc(shownTitle) + '</text>' +
         '<text class="t2" x="46" y="' + (small?36:41) + '">' + esc(n.sub || '') + '</text>' +
         (hasNodeLink ?

           '<circle cx="' + (p.w - 15) + '" cy="14" r="9" fill="transparent"/>' +
           '<text x="' + (p.w - 15) + '" y="18" text-anchor="middle">&#8599;</text></a>' : '') +

           '<title>Links · right-click this node or open here</title><circle cx="' + referenceX + '" cy="14" r="10" fill="transparent"/>' +
           '<text x="' + referenceX + '" y="18" text-anchor="middle">&#8943;</text></g>' : '') +
         (siblingPages.length ?
           '<g class="nbackref" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" data-dv-node-id="' + esc(id) + '" aria-label="Other pages containing ' + esc(nodeTitle) + '">' +

           '<text x="' + backlinkX + '" y="18" text-anchor="middle">&#8599;</text></g>' : '') +

  });
  s += '</svg>';
  el.innerHTML = s;
  var svg = el.firstChild;
  var nodeEls = {};
  Object.keys(d.nodes).forEach(function(id){
    var node = document.getElementById(prefix + '-n-' + id);
    if (node) nodeEls[id] = node;
  });
  wireNodeBacklinks(el, svg, d, prefix, backlinks);
  el._nodeLinks=wireNodeReferences(el,svg,d,prefix);

  /* measured pass: labels, coins, ambient loop dots, manual step dots */
  var stepByEdge = {};

    (d.edges || []).forEach(function(e){
      var info = edgeIds[e.from + '->' + e.to];

    var rects = labelEls.map(function(le){
      var b;
      try { b = le.el.getBBox(); } catch (ex) { b = null; }
      if (!b || !b.width) return {x: 0, y: 0, w: 0, h: 0, fixed: true};
      var r = {x: b.x, y: b.y, w: b.width, h: b.height, fixed: le.fixed};

    });

    labelEls.forEach(function(le, i){

      le.el.setAttribute('x', parseFloat(le.el.getAttribute('x')) + n.dx);
      le.el.setAttribute('y', parseFloat(le.el.getAttribute('y')) + n.dy);
    });
  })();

  /* badges for labeled delta edges — after the collision pass, at each
     label's settled top-right corner */
  pendingLabelBadges.forEach(function(pb){
    var b;
    try { b = pb.lbl.getBBox(); } catch (ex){ b = null; }
    var badge = (b && b.width) ?
      deltaBadge(svg, b.x + b.width + 3, b.y - 6, 9, 8) :
      /* hidden-context fallback (a section inside an inactive tab measures
         as zero): sit just above-right of the label's anchor point */
      deltaBadge(svg, parseFloat(pb.lbl.getAttribute('x')) + 4,
                 parseFloat(pb.lbl.getAttribute('y')) - 18, 9, 8);
    markFragmentElement(badge, pb.e);
  });

  function makeDot(info, cls){
    var col = kindColor(protos, info.kind, skinBase(skin));
    var dot = document.createElementNS(SVGNS, 'circle');
    dot.setAttribute('class', cls + ' dv-protocol-fill' + (info.e.delta === true ? ' dvd' : ''));
    dot.setAttribute('r', SK.glow ? 4 : 3.4);

  (d.steps || []).forEach(function(st, i){
    stepDeliveredKeys(st).forEach(function(k, j){
      var info = edgeIds[k];
      if (!info) return;

      var dot = makeDot(info, 'pkt loopdot');
      dot.appendChild(motion(info.domId, dur, (-(i * 0.7 + j * 0.35)).toFixed(2) + 's', false));
      svg.appendChild(dot);
    });
  });

  /* manual step dots: one per unique step edge, fired by the stepper */
  var manualDone = {};
  (d.steps || []).forEach(function(st){
    stepDeliveredKeys(st).forEach(function(k){
      var info = edgeIds[k];
      if (!info || manualDone[k]) return;
      manualDone[k] = true;
      var path = document.getElementById(info.domId);
      var dur = clamp(path.getTotalLength() / 450, 0.8, 1.6);
      var dot = makeDot(info, 'pkt cpkt');
      dot.appendChild(motion(info.domId, dur, 'indefinite', true, prefix + '-am-' + info.idx));
      svg.appendChild(dot);
    });
  });

  return {kindsUsed: Object.keys(kindsUsed), anyRet: anyRet, edgeIds: edgeIds,
    nodeEls: nodeEls, svg: svg};
}

/* ---------------- pure widget models (node-testable, no DOM) ---------------- */
function traceIntervalUnion(intervals){
  var sorted=intervals.filter(function(v){ return v[1]>v[0]; }).map(function(v){ return v.slice(); })
    .sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; }), out=[];
  sorted.forEach(function(v){
    var last=out[out.length-1];
    if (last && v[0]<=last[1]) last[1]=Math.max(last[1],v[1]); else out.push(v);
  });
  return out;
}
function traceTimingModel(panel,state){
  var data=tracePanelData(panel);
  if (data.errors.length) return {errors:data.errors,notices:data.notices};
  var spans=data.spans.sort(function(a,b){ return a.startMs-b.startMs || (a.id<b.id?-1:a.id>b.id?1:0); });
  var byId=new Map(), children=new Map();
  spans.forEach(function(s){ byId.set(s.id,s); });
  spans.forEach(function(s){ if (!children.has(s.parentId)) children.set(s.parentId,[]); children.get(s.parentId).push(s); });
  var selected=state && state.selected!=null ? byId.get(state.selected) : spans[0];
  if (!selected) return {errors:['Selected span is unavailable.'],notices:data.notices};
  function duration(intervals){ return intervals.reduce(function(sum,v){ return sum+(v[1]-v[0]); },0); }
  function stats(s){
    var childSpans=children.get(s.id)||[];
    var covered=traceIntervalUnion(childSpans.map(function(c){ return [Math.max(s.startMs,c.startMs),Math.min(s.startMs+s.ms,c.startMs+c.ms)]; }));
    var childMs=Math.min(s.ms,duration(covered));
    return {span:s,covered:covered,childMs:childMs,uncoveredMs:Math.max(0,s.ms-childMs),children:childSpans};
  }
  var serviceSpans=spans.filter(function(s){ return s.service===selected.service; });
  var serviceIntervals=traceIntervalUnion(serviceSpans.map(function(s){ return [s.startMs,s.startMs+s.ms]; }));
  var serviceStart=Math.min.apply(null,serviceSpans.map(function(s){ return s.startMs; }));
  var serviceEnd=Math.max.apply(null,serviceSpans.map(function(s){ return s.startMs+s.ms; }));
  var rows=[];
  function visit(s,depth){
    if (s.service===selected.service){ var row=stats(s); row.depth=depth; rows.push(row); }
    (children.get(s.id)||[]).forEach(function(c){ visit(c,depth+1); });
  }
  spans.filter(function(s){ return !s.parentId || !byId.has(s.parentId); }).forEach(function(s){ visit(s,0); });
  return {errors:[],notices:data.notices,selected:stats(selected),rows:rows,service:selected.service,
    serviceStart:serviceStart,serviceEnd:serviceEnd,serviceCoverageMs:duration(serviceIntervals)};
}
function tracePanelHTML(panel,state,states){
  var m=traceTimingModel(panel,state);
  function ms(n){ return String(Math.round(n*1000)/1000)+' ms'; }
  if (m.errors.length) return '<div class="tr-time"><b>Timing unavailable</b><p>'+esc(m.errors.join(' · '))+'</p></div>';
  var s=m.selected, duration=s.span.ms, h='<div class="tr-time">';
  var serviceSteps=new Map(), spanServices=new Map();
  panel.spans.forEach(function(span){ spanServices.set(span.id,span.service); });
  (states||[]).forEach(function(st,i){ var service=st && spanServices.get(st.selected); if (service && !serviceSteps.has(service)) serviceSteps.set(service,i); });
  if (serviceSteps.size>1){
    h+='<label class="tr-picker">Inspect service<select data-dv-trace-service aria-label="Inspect service">';
    serviceSteps.forEach(function(i,service){ h+='<option value="'+i+'"'+(service===m.service?' selected':'')+'>'+esc(service)+'</option>'; });
    h+='</select></label>';
  }
  h+='<div class="tr-service">'+esc(m.service)+'</div><p class="tr-coverage">Service span coverage (union): <b>'+ms(m.serviceCoverageMs)+'</b> · '+m.rows.length+' observed span(s)</p>';
  h+='<div class="tr-selected"><b>'+esc(s.span.name)+'</b><code>'+esc(s.span.id)+'</code><small>Parent: '+esc(s.span.parentId||'none')+'</small></div>';
  h+='<dl class="tr-metrics"><div><dt>Inclusive</dt><dd>'+ms(duration)+'</dd></div><div><dt>Child-covered</dt><dd>'+ms(s.childMs)+'</dd></div><div><dt>Uncovered</dt><dd>'+ms(s.uncoveredMs)+'</dd></div></dl>';
  h+='<div class="tr-interval'+(duration===0?' tr-zero':'')+'" role="img" aria-label="'+esc('Selected span: '+ms(duration)+' inclusive, '+ms(s.childMs)+' child-covered, '+ms(s.uncoveredMs)+' uncovered')+'">';
  s.covered.forEach(function(v){
    h+='<span class="tr-covered" style="left:'+((v[0]-s.span.startMs)/duration*100).toFixed(4)+'%;width:'+((v[1]-v[0])/duration*100).toFixed(4)+'%"></span>';
  });
  h+='</div><p class="tr-key">'+(duration===0?'Zero-duration span; no wall-time interval.':'<span>Blue: child-covered</span> · <span>Hatched: uncovered</span>')+'</p>';
  h+='<p class="tr-explain">Direct-child intervals count once where they overlap and are clipped to this span. Uncovered wall time can include local work, waiting, and missing instrumentation; it is not CPU time.</p>';
  m.notices.forEach(function(n){ h+='<p class="tr-notice">'+esc(n)+'</p>'; });
  h+='<div class="tr-ophead">Service operations · inclusive / uncovered</div><div class="tr-operations">';
  m.rows.forEach(function(r){
    var step=(states||[]).findIndex(function(st){ return st && st.selected===r.span.id; });
    var extent=m.serviceEnd-m.serviceStart, selected=r.span.id===s.span.id;
    var description=r.span.name+' · '+r.span.id+' · parent '+(r.span.parentId||'none')+' · +'+ms(r.span.startMs)+' · '+ms(r.span.ms)+' inclusive / '+ms(r.uncoveredMs)+' uncovered'+(r.span.error===true?' · recorded error':'');
    h+='<'+(step>=0?'button type="button" data-dv-trace-step="'+step+'"':'div')+' class="tr-op'+(selected?' tr-current':'')+'" title="'+esc(description)+'"'+(step>=0?' aria-label="Inspect '+esc(description)+'"':'')+'>';
    h+='<span class="tr-opname">'+(r.depth?'↳ ':'')+esc(r.span.name)+(r.span.error===true?' · ERROR':'')+'</span><span class="tr-opvalues">'+ms(r.span.ms)+' / '+ms(r.uncoveredMs)+'</span>';
    h+='<span class="tr-optrack"><span style="left:'+(extent?(r.span.startMs-m.serviceStart)/extent*100:0).toFixed(4)+'%;width:'+(extent?r.span.ms/extent*100:0).toFixed(4)+'%"></span></span>';
    h+='</'+(step>=0?'button':'div')+'>';
  });
  h+='</div><p class="tr-explain">Rows share the service’s +'+ms(m.serviceStart)+' to +'+ms(m.serviceEnd)+' scale. Nested spans overlap; row durations must not be added. The parent ID remains in each row’s tooltip.</p>';
  if (s.children.length){
    h+='<details class="tr-children"><summary>'+s.children.length+' direct child span(s)</summary><ul>';
    s.children.forEach(function(c){ h+='<li>'+esc(c.service+' · '+c.name)+' · '+ms(c.ms)+(c.service===m.service?' · same service':' · other service')+'</li>'; });
    h+='</ul></details>';
  }
  return h+'</div>';
}

function waterfallModel(spans, state){
  spans = Array.isArray(spans) ? spans : [];
  state = state || {};
  var total = 0, cursor = 0;
  var timed = spans.some(function(s){ return s && isFiniteNum(s.startMs) && s.startMs >= 0; });
  var measured = spans.map(function(s){
    var ms = s && isFiniteNum(s.ms) && s.ms > 0 ? s.ms : 0;
    var start = s && isFiniteNum(s.startMs) && s.startMs >= 0 ? s.startMs : cursor;
    cursor = start + ms;
    total = Math.max(total, cursor);
    return {ms: ms, start: start};
  });
  var reveal = (typeof state.reveal === 'number') ? clamp(state.reveal, 0, spans.length) : spans.length;
  var shown = 0, rows = [];
  spans.forEach(function(s, i){
    var ms = measured[i].ms, off = measured[i].start;
    var revealed = i < reveal;
    if (revealed) shown = Math.max(shown, off + ms);
    rows.push({id: s && s.id, label: (s && (s.label || s.id)) || '', ms: ms,
               startMs: off, error: !!(s && s.error === true),
               offsetPct: total ? off / total * 100 : 0,
               widthPct: total ? ms / total * 100 : 0,
               revealed: revealed, highlight: !!(s && state.highlight === s.id)});
  });
  return {rows: rows, totalMs: total, shownMs: shown, timed: timed,
          totalLabel: state.total != null ? String(state.total) : shown + ' ms'};
}

function orbitPositions(n, cx, cy, r){
  var out = [];
  for (var i = 0; i < n; i++){
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    out.push({x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)});
  }
  return out;
}

/* zones/layers patches replace the whole array (fold is a shallow merge);
   the model joins the declared geometry with the latest state array. */
function zoneModel(declared, stateZones){
  var ZKINDS = ['armed','ignored','masked'];
  var st = {};
  (Array.isArray(stateZones) ? stateZones : []).forEach(function(z){
    if (z && z.id) st[z.id] = z.state;
  });
  return (Array.isArray(declared) ? declared : []).map(function(z){
    z = z || {};
    var s = st[z.id] != null ? st[z.id] : (z.state || 'armed');
    if (ZKINDS.indexOf(s) < 0) s = 'armed';
    var zpts = (Array.isArray(z.points) ? z.points : []).filter(function(p){
      return Array.isArray(p) && typeof p[0] === 'number' && isFinite(p[0]) &&
             typeof p[1] === 'number' && isFinite(p[1]);
    });
    return {id: z.id, label: z.label || z.id || '', state: s, points: zpts};
  });
}

function xrayModel(declared, stateLayers){
  var st = {};
  (Array.isArray(stateLayers) ? stateLayers : []).forEach(function(l){
    if (l && l.id) st[l.id] = l.open === true;
  });
  return (Array.isArray(declared) ? declared : []).map(function(l){
    l = l || {};
    return {id: l.id, label: l.label || l.id || '', holder: l.holder || '',
            open: st[l.id] === true};
  });
}

/* pir line-of-sight widget: a mounted IR/PIR sensor projects a field-of-view
   cone; a subject dot is tested against it and rendered tripped or clear. Pure
   model (node-testable, no DOM). Frame is 320x180. `facing` is degrees measured
   clockwise from +x in screen space (y grows downward): 0=right, 90=down,

/* tiles widget: a device-fleet grid — one named tile per device/cohort with
   a state chip and an optional sub-line. Pure model (node-testable). Tiles

/* signal widget: link health for 1–6 named radio/wired links. Pure model

/* radar widget: a top-down range view — concentric distance rings inside a

/* Room lighting is a view of the authored scene, not a simulated sensor or
   containment rule. The highest visible device state wins, then occupancy. */
function homemapRoomModel(panel, model){
  return homemapRooms(panel).map(function(room){
    function inside(item){
      var house = model.outline;

          item.y > house.y && item.y < house.y + house.h) return false;
      return item.x >= room.x && item.y >= room.y &&
        (item.x < room.x + room.w || (item.x === 320 && room.x + room.w === 320)) &&
        (item.y < room.y + room.h || (item.y === 180 && room.y + room.h === 180));

function homemapDoorHTML(d, transition, outline){

  var body = '<g class="hmdev hm-entry hm-' + esc(d.state) + ' hm-floor-door" data-device="' + esc(d.id) + '">' +
    '<title>' + esc(d.label) + ': ' + esc(d.state) + '</title>' +
    '<g transform="translate(' + d.x + ' ' + (d.y * HOMEMAP_Y_SCALE) + ') scale(1 ' + HOMEMAP_Y_SCALE + ') rotate(' + d.facing + ')">' +
    '<path class="hm-door-threshold" d="M-1 0 H' + (w + 1) + '"/>' +
    '<path class="hm-door-hit" d="M0 0 H' + w + ' M' + w + ' 0 A' + w + ' ' + w + ' 0 0 ' + (d.doorSwing > 0 ? 1 : 0) + ' ' + endX + ' ' + endY + '"/>' +
    '<path class="hm-door-arc" d="M' + w + ' 0 A' + w + ' ' + w + ' 0 0 ' + (d.doorSwing > 0 ? 1 : 0) + ' ' + endX + ' ' + endY + '"/>' +
    '<g class="hm-floor-leaf' + (transition ? ' hm-floor-' + transition : '') + '" style="--hm-door-angle:' + d.doorSwing + 'deg">' +
    '<path d="M0 0 H' + w + '"/><circle class="hm-door-handle" cx="' + (w - 4) + '" cy="-2" r="1"/></g>' +
    '<path class="hm-door-jamb" d="M0 -3 V3 M' + w + ' -3 V3"/><circle class="hm-door-hinge" r="1.8"/></g>';
  var labelX = d.x, labelY = d.y > 139 ? d.y * HOMEMAP_Y_SCALE - 14 : d.y * HOMEMAP_Y_SCALE + 16;
  var direction = d.facing * Math.PI / 180;
  if (outline && Math.abs(Math.cos(direction)) > .7){
    labelX += w * Math.cos(direction) / 2;
    labelY = (d.y + w * Math.sin(direction) / 2) * HOMEMAP_Y_SCALE + (d.y < outline.y + outline.h / 2 ? -14 : 14);
  }
  return body + '<text class="hmlbl" x="' + clamp(labelX, 28, 292) + '" y="' + clamp(labelY, 10, HOMEMAP_DISPLAY_HEIGHT - 5) + '" text-anchor="middle">' + esc(d.label) + '</text></g>';
}

function radarModel(panel, state){

    }).map(function(p){ return [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]; });

  var parts = [];
  BUFFER_CELL_STATES.forEach(function(sname){
    if (sname !== 'empty' && counts[sname]) parts.push(counts[sname] + ' ' + sname);
  });
  return {n: n, cells: cells, head: head, counts: counts,
          capacity: panel.capacity != null ? String(panel.capacity) : '',
          note: state.note != null ? String(state.note)
                : (state.label != null ? String(state.label) : ''),
          summary: parts.length ? parts.join(' · ') : 'empty'};
}

/* inflight widget: operations/messages as bars on one shared step axis.
   foldInflightStates (validator.js) supplies complete history snapshots;
   this pure model vets that snapshot for the HTML renderer. */
/* timeline: wall-clock axis over a declared span with periodic cadence
   beats and event dots; steps sweep a `now` cursor and append events.
   Pure model (node-testable, no DOM). */
function timelineLabelRows(events){
  /* deterministic label collision layout: labels go on row 0, overflow
     to row 1, and drop to hover-title-only (labelRow null) when both
     rows are occupied at that x. Widths are estimated from the 8.5px
     mono glyphs; x positions mirror the renderer's clamp. */
  var charW = 5.1;
  var ends = [-Infinity, -Infinity];
  events.forEach(function(e){
    if (!e.label){ e.labelRow = null; return; }
    /* the estimate and the drawing must agree: long labels TRUNCATE to
       what the estimate measures (the hover title keeps the full text) */
    e.labelText = e.label.length > 22 ? e.label.slice(0, 21) + '\u2026' : e.label;
    var x = Math.min(Math.max(6 + e.pct / 100 * 308, 16), 304);
    var half = e.labelText.length * charW / 2;
    var xs = x - half, xe = x + half;
    if (xs >= ends[0] + 4){ e.labelRow = 0; ends[0] = xe; }
    else if (xs >= ends[1] + 4){ e.labelRow = 1; ends[1] = xe; }
    else e.labelRow = null;
  });
  return events;
}
/* cadence lanes: several periodic processes on ONE wall-clock axis,
   each lane rendered in a density REGIME chosen by its beat count over
   the span — individual dots, a true-spacing tick comb, a solid band,
   or an empty row with a "next in …" promise. The regime is the
   orders-of-magnitude contrast. Pure model. */
var TL_DOT_MAX = 32;   /* beats drawable as individual dots on the track */
var TL_COMB_MAX = 120; /* beats drawable as a legible tick comb */
function timelineLanesModel(panel, state){
  panel = panel || {}; state = state || {};
  var span = parseClock(panel.span);
  if (span == null || span <= 0) span = 3600;
  if (span > TIMELINE_MAX_SPAN) span = TIMELINE_MAX_SPAN;
  var units = [60, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  var unit = units[units.length - 1];
  for (var i = 0; i < units.length; i++){
    if (span / units[i] <= 8){ unit = units[i]; break; }
  }
  var ticks = [];
  for (var ts = 0; ts <= span + 1e-6 && ticks.length <= 12; ts += unit)
    ticks.push({s: ts, pct: ts / span * 100, label: formatClock(ts)});
  var nowS = parseClock(state.now);
  var now = null;
  if (nowS != null){
    var nc = Math.min(Math.max(nowS, 0), span);
    now = {s: nc, pct: nc / span * 100, label: formatClock(nc)};
  }
  function normList(list){
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function(e){
      if (!e) return;
      var at = parseClock(e.at);
      if (at == null) return;
      var s = Math.min(Math.max(at, 0), span);
      out.push({s: s, pct: s / span * 100,
                lane: e.lane != null ? String(e.lane) : null,
                label: e.label != null ? String(e.label) : '',
                kind: ['ok', 'alert', 'info'].indexOf(e.kind) >= 0 ? e.kind : 'info'});
    });
    return out;
  }
  var allEvents = normList(panel.events).concat(normList(state.events));
  var misses = normList(state.miss);
  var seen = Object.create(null);
  var lanes = [];
  ((Array.isArray(panel.lanes)) ? panel.lanes : []).forEach(function(l){
    if (lanes.length >= 4) return;
    if (!l || typeof l !== 'object' || l.id == null) return;
    var id = String(l.id);
    if (seen[id]) return;
    var every = parseClock(l.every);
    if (every == null || every <= 0) return;
    seen[id] = true;
    var count = Math.floor((span + 1e-6) / every);
    var regime = count < 1 ? 'sparse' : count <= TL_DOT_MAX ? 'dots' :
                 count <= TL_COMB_MAX ? 'comb' : 'band';
    var beats = [];
    if (regime === 'dots'){
      for (var b = every; b <= span + 1e-6; b += every)
        beats.push({s: b, pct: b / span * 100, past: !!(now && b <= now.s + 1e-6)});
    }
    var badge;
    if (regime === 'sparse'){
      if (now){
        var nextAt = (Math.floor((now.s + 1e-6) / every) + 1) * every;
        badge = 'next in ' + formatClock(nextAt - now.s) + ' \u25b8';
      } else badge = 'every ' + formatClock(every);
    } else badge = count + '\u00d7';
    lanes.push({id: id,
                label: l.label != null ? String(l.label) : id,
                every: every, everyLabel: formatClock(every),
                regime: regime, count: count, beats: beats,
                spacingPct: every / span * 100,
                badge: badge,
                misses: misses.filter(function(m){ return m.lane === id; }),
                events: allEvents.filter(function(e){ return e.lane === id; })});
  });
  return {span: span, spanLabel: formatClock(span), ticks: ticks, now: now,
          lanes: lanes,
          axisEvents: allEvents.filter(function(e){ return e.lane == null || !seen[e.lane]; })};
}

function timelineModel(panel, state){
  panel = panel || {}; state = state || {};
  var span = parseClock(panel.span);
  if (span == null || span <= 0) span = 3600;
  if (span > TIMELINE_MAX_SPAN) span = TIMELINE_MAX_SPAN; /* validator warns */
  /* tick unit: coarsest table entry giving at most 8 intervals; the top
     entry (1d) covers the clamped 7d maximum within the bound */
  var units = [60, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  var unit = units[units.length - 1];
  for (var i = 0; i < units.length; i++){
    if (span / units[i] <= 8){ unit = units[i]; break; }
  }
  var ticks = [];
  for (var ts = 0; ts <= span + 1e-6 && ticks.length <= 12; ts += unit)
    ticks.push({s: ts, pct: ts / span * 100, label: formatClock(ts)});
  var every = panel.cadence ? parseClock(panel.cadence.every) : null;
  var beats = [], beatsOmitted = 0;
  if (every != null && every > 0){
    var beatCount = Math.floor((span + 1e-6) / every);
    if (beatCount > TIMELINE_MAX_BEATS){
      /* sub-pixel soup — draw none, report the count instead of
         silently truncating the cadence */
      beatsOmitted = beatCount;
    } else {
      for (var b = every; b <= span + 1e-6; b += every)
        beats.push({s: b, pct: b / span * 100});
    }
  }
  function norm(list){
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function(e){
      if (!e) return;
      var at = parseClock(e.at);
      if (at == null) return;
      var s = Math.min(Math.max(at, 0), span);
      out.push({s: s, pct: s / span * 100,
                label: e.label != null ? String(e.label) : '',
                kind: ['ok', 'alert', 'info'].indexOf(e.kind) >= 0 ? e.kind : 'info'});
    });
    return out;
  }
  var events = norm(panel.events).concat(norm(state.events));
  events.sort(function(a, b){ return a.s - b.s; });
  timelineLabelRows(events);
  var nowS = parseClock(state.now);
  var now = null;
  if (nowS != null){
    var c = Math.min(Math.max(nowS, 0), span);
    now = {s: c, pct: c / span * 100, label: formatClock(c)};
  }
  /* detail window: the cadence interval containing `now`, magnified so
     events BETWEEN two long-running beats spread out legibly. Derived —
     no spec field. Absent without a cadence or a cursor. */
  var detail = null;
  if (every != null && every > 0 && now){
    var k = Math.floor((now.s + 1e-6) / every);
    var dStart = k * every;
    if (dStart >= span) dStart = Math.max(span - every, 0);
    var dEnd = Math.min(dStart + every, span);
    if (dEnd > dStart){
      var dLen = dEnd - dStart;
      var dEvents = [];
      events.forEach(function(e){
        if (e.s >= dStart - 1e-6 && e.s <= dEnd + 1e-6)
          dEvents.push({s: e.s, pct: (e.s - dStart) / dLen * 100, label: e.label, kind: e.kind});
      });
      timelineLabelRows(dEvents);
      var dUnits = [1, 5, 10, 30, 60, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200];
      var dUnit = dUnits[dUnits.length - 1];
      for (var di = 0; di < dUnits.length; di++){
        if (dLen / dUnits[di] <= 6){ dUnit = dUnits[di]; break; }
      }
      var dTicks = [];
      for (var dts = Math.ceil((dStart + 1e-6) / dUnit) * dUnit;
           dts < dEnd - 1e-6 && dTicks.length <= 8; dts += dUnit)
        dTicks.push({s: dts, pct: (dts - dStart) / dLen * 100});
      detail = {start: dStart, end: dEnd,
                startLabel: formatClock(dStart), endLabel: formatClock(dEnd),
                startPct: dStart / span * 100, endPct: dEnd / span * 100,
                ticks: dTicks, events: dEvents,
                nowPct: Math.min(Math.max((now.s - dStart) / dLen * 100, 0), 100),
                startPast: now.s >= dStart - 1e-6, endPast: now.s >= dEnd - 1e-6};
    }
  }
  return {span: span, spanLabel: formatClock(span), unit: unit, ticks: ticks,
          beats: beats, beatsOmitted: beatsOmitted, every: every, events: events, now: now,
          detail: detail,
          cadenceLabel: panel.cadence && panel.cadence.label != null ? String(panel.cadence.label) : ''};
}

function inflightModel(panel, state, stepCount, currentStep){
  panel = panel || {}; state = state || {};
  var seen = {};
  var lanes = (Array.isArray(panel.lanes) ? panel.lanes : []).slice(0, 8).map(function(l){
    if (!l || !l.id || seen[l.id]) return null;
    seen[l.id] = true;
    return {id:String(l.id), label:l.label != null ? String(l.label) : String(l.id), bars:[]};
  }).filter(Boolean);
  var byId = {};
  lanes.forEach(function(l){ byId[l.id] = l; });
  var n = typeof stepCount === 'number' && isFinite(stepCount) ? Math.max(0, Math.round(stepCount)) :
          (typeof state.stepCount === 'number' ? Math.max(0, Math.round(state.stepCount)) : 0);
  var cur = typeof currentStep === 'number' && isFinite(currentStep) ? Math.round(currentStep) :
            (typeof state.currentStep === 'number' ? Math.round(state.currentStep) : 0);
  if (n) cur = clamp(cur, 0, n - 1); else cur = 0;
  (Array.isArray(state.bars) ? state.bars : []).forEach(function(b){
    if (!b || !byId[b.lane] || !validRevealIndex(b.start)) return;
    var end = validRevealIndex(b.end) ? b.end : null;
    var st = INFLIGHT_STATES.indexOf(b.state) >= 0 ? b.state : 'ok';
    byId[b.lane].bars.push({lane:b.lane, label:b.label != null ? String(b.label) : '',
      start:b.start, end:end, state:st, open:end == null});
  });
  return {lanes:lanes, stepCount:n, currentStep:cur};
}

function inflightPanelHTML(panel, state, stepCount, currentStep){
  var m = inflightModel(panel, state, stepCount, currentStep);
  if (!m.lanes.length) return '<div class="ifempty">no lanes</div>';
  var n = Math.max(1, m.stepCount);
  var h = '<div class="ifbox"><div class="ifaxis"><span class="ifaxislabel">step</span><span class="ifticks">';
  for (var i = 0; i < m.stepCount; i++){
    h += '<span class="iftick' + (i === m.currentStep ? ' cur' : '') + '" style="left:' +
         ((i + 0.5) / n * 100).toFixed(3) + '%">' + i + '</span>';
  }
  h += '</span></div>';
  m.lanes.forEach(function(lane){
    h += '<div class="ifrow"><span class="iflabel" title="' + esc(lane.label) + '">' + esc(lane.label) +
         '</span><span class="iftrack">';
    if (m.stepCount) h += '<i class="ifnow" style="left:' + (m.currentStep / n * 100).toFixed(3) +
      '%;width:' + (100 / n).toFixed(3) + '%"></i>';
    for (var gi = 1; gi < n; gi++) h += '<i class="ifgrid" style="left:' + (gi / n * 100).toFixed(3) + '%"></i>';
    lane.bars.forEach(function(bar){
      var last = bar.open ? m.currentStep : bar.end;
      last = Math.max(bar.start, Math.min(n - 1, last));
      var left = bar.start / n * 100;
      var width = (last - bar.start + 1) / n * 100;
      h += '<b class="ifbar s-' + bar.state + (bar.open ? ' open' : '') + '" style="left:' +
           left.toFixed(3) + '%;width:' + width.toFixed(3) + '%" title="' + esc(bar.label || lane.label) +
           ' · steps ' + bar.start + (bar.open ? '+' : '–' + bar.end) + '">' + esc(bar.label) + '</b>';
    });
    h += '</span></div>';
  });
  return h + '</div>';
}

/* Stable presentation keys and target widths for inflight bars. These frames
   are never folded back into state; they only let a rebuilt bar begin at its
   previous painted width during an adjacent transition. */
function inflightBarFrames(model){
  var frames = [], seen = {}, n = Math.max(1, model.stepCount);
  model.lanes.forEach(function(lane){
    lane.bars.forEach(function(bar){
      var base = lane.id + '\n' + bar.start + '\n' + bar.label;
      var ordinal = seen[base] || 0;
      seen[base] = ordinal + 1;
      var last = bar.open ? model.currentStep : bar.end;
      last = Math.max(bar.start, Math.min(n - 1, last));
      frames.push({key:base + '\n' + ordinal,
        width:(last - bar.start + 1) / n * 100});
    });
  });
  return frames;
}

/* phone widget: a generic handset lock screen backed by the absolute unread
   stack produced by foldPhoneStates. The model keeps the full count for the
   computed badge while exposing only the three cards that can fit. */
function phoneBrand(panel){
  var brand = panel && panel.brand;
  if (!phoneBrandIsPlainObject(brand)) return null;
  var out = {};
  if (typeof brand.app === 'string') out.app = brand.app;
  if (typeof brand.logo === 'string' && brand.logo.length >= 1 && brand.logo.length <= 4)
    out.logo = brand.logo;
  /* These values enter an inline style: accept only literal hex colors. */
  ['accent', 'bg', 'fg'].forEach(function(k){
    if (typeof brand[k] === 'string' && (brand[k].length === 4 || brand[k].length === 7) &&
        /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(brand[k]))
      out[k] = brand[k];
  });
  return Object.keys(out).length ? out : null;
}

function phoneModel(panelOrState, stepsOrState, currentStep){
  var state;
  /* Public fold form: phoneModel(panel, diagramSteps, targetIndex). This is
     useful to callers/tests that need the complete target state without
     first reaching through foldPanelStates. Omit targetIndex for the end. */
  if (Array.isArray(stepsOrState)){
    var folded = foldPhoneStates(panelOrState || {}, stepsOrState);
    var target = typeof currentStep === 'number' && isFinite(currentStep) ? Math.round(currentStep) : folded.length - 1;
    state = folded[clamp(target, 0, folded.length - 1)] || {};
  } else if (stepsOrState && typeof stepsOrState === 'object' && !Array.isArray(stepsOrState)){
    /* Conventional widget-model form: phoneModel(panel, absoluteState). */
    state = stepsOrState;
  } else {
    /* Compact renderer form: phoneModel(absoluteState). */
    state = panelOrState || {};
  }
  var notifications = (Array.isArray(state.notifications) ? state.notifications : []).map(function(n){
    if (!n || typeof n !== 'object' || Array.isArray(n) || typeof n.app !== 'string' || !n.app) return null;
    return {app:n.app,
      title:typeof n.title === 'string' ? n.title : '',
      text:typeof n.text === 'string' ? n.text : ''};
  }).filter(Boolean);
  return {
    clock:typeof state.clock === 'string' ? state.clock : '',
    notifications:notifications,
    cards:notifications.slice(0, 3),
    count:notifications.length,
    badge:notifications.length,
    overflow:Math.max(0, notifications.length - 3),
    added:typeof state._phoneAdded === 'number' ? Math.max(0, Math.round(state._phoneAdded)) : 0
  };
}

function phonePanelHTML(panel, state, fresh){
  panel = panel || {};
  var m = phoneModel(panel, state);
  var brand = phoneBrand(panel);
  var styles = [];
  if (brand){
    if (brand.accent) styles.push('--phacc:' + brand.accent);
    if (brand.bg) styles.push('--phbg:' + brand.bg);
    if (brand.fg) styles.push('--phfg:' + brand.fg);
  }
  var label = m.count ? 'Phone with ' + m.count + ' unread notification' + (m.count === 1 ? '' : 's') :
    'Phone with no notifications';
  if (brand && brand.app) label = brand.app + ' phone' + label.slice(5);
  var h = '<div class="phoneframe"' + (styles.length ? ' style="' + styles.join(';') + '"' : '') +
    ' role="img" aria-label="' + esc(label) + '">' +
    '<span class="phonespeaker" aria-hidden="true"></span>' +
    '<div class="phonestatus"><span class="phoneclock">' + esc(m.clock) + '</span>' +
    '<span class="phoneglyphs" aria-hidden="true"><span class="phonesignal"><i></i><i></i><i></i></span>' +
    '<span class="phonebattery"><i></i></span></span></div>';
  if (brand && (brand.app || brand.logo))
    h += '<div class="phonebrand">' +
      (brand.logo ? '<span class="phonelogo" aria-hidden="true">' + esc(brand.logo) + '</span>' : '') +
      (brand.app ? '<span class="phonebrandname">' + esc(brand.app) + '</span>' : '') + '</div>';
  if (m.count)
    h += '<span class="phonebadge" aria-hidden="true">' + m.badge + '</span>';
  h += '<div class="phonecards">';
  if (!m.cards.length){
    h += '<div class="phoneempty">no notifications</div>';
  } else {
    m.cards.forEach(function(card, i){
      h += '<div class="phonecard' + (fresh && i === 0 ? ' fresh' : '') + '">' +
        '<div class="phoneapp" title="' + esc(card.app) + '">' + esc(card.app) + '</div>' +
        (card.title ? '<div class="phonetitle" title="' + esc(card.title) + '">' + esc(card.title) + '</div>' : '') +
        (card.text ? '<div class="phonetext" title="' + esc(card.text) + '">' + esc(card.text) + '</div>' : '') +
        '</div>';
    });
  }
  h += '</div>';
  if (m.overflow) h += '<div class="phoneoverflow">+' + m.overflow + ' more</div>';
  return h + '<span class="phonehome" aria-hidden="true"></span></div>';
}

/* queue widget: mailbox — a message enqueued, held, dequeued. Pure model +
   markup builder so node tests cover them without a DOM. Directional context:
   `from` shows during enqueue (arrival side), `to` during dequeue (departure
   side), `reason` while held (the waiting-on line). Carried like any patch
   field; only the state-relevant one renders. Non-strings are ignored (the
   validator warns). */
function queueModel(state){
  state = state || {};
  var s = QUEUE_STATES.indexOf(String(state.state)) >= 0 ? String(state.state) : 'empty';
  function str(v){ return typeof v === 'string' ? v : ''; }
  return {state: s, label: state.label != null ? String(state.label) : '',
          from: str(state.from), to: str(state.to), reason: str(state.reason)};
}

function queuePanelHTML(panel, state){
  var qm = queueModel(state);
  var h = '<div class="qbox s-' + qm.state + '">';
  h += '<div class="qtrack">';
  h += '<span class="qarr qarr-in" aria-hidden="true">&#8594;</span>';
  h += '<div class="qslot">';
  if (qm.state === 'empty') h += '<span class="qempty">empty</span>';
  else h += '<span class="qmsg">' + esc(qm.label || 'message') + '</span>';
  h += '</div>';
  h += '<span class="qarr qarr-out" aria-hidden="true">&#8594;</span>';
  h += '</div>';
  /* directional context row: arrival label on the in-side during enqueue,
     departure label on the out-side during dequeue. Both spans are ALWAYS
     emitted (populated only in the relevant state) so the row reserves a
     fixed height and the panel never changes size between steps — otherwise
     the panel column and the step bar below it reflow. Static text, so it is
     reduced-motion safe. */
  var ctxIn = (qm.state === 'enqueue') ? esc(qm.from) : '';
  var ctxOut = (qm.state === 'dequeue') ? esc(qm.to) : '';
  h += '<div class="qctx"><span class="qside qside-in">' + ctxIn + '</span>' +
       '<span class="qside qside-out">' + ctxOut + '</span></div>';
  h += '<div class="qstatecap">' + qm.state + '</div>';
  /* waiting-on line, shown while held; container always emitted (empty
     otherwise) and clamped to a fixed height so its length cannot reflow. */
  var reason = (qm.state === 'held') ? esc(qm.reason) : '';
  h += '<div class="qreason">' + reason + '</div>';
  h += '</div>';
  return h;
}

/* inline markup: a small, safe subset for prose. The whole string is ESCAPED
   FIRST, then a fixed set of substitutions is applied, so labels/URLs are
   always HTML-safe and only http/https links are ever emitted (never
   javascript:/data:). Supported:
     [label](https://url)  ->  underlined anchor
     **bold**              ->  <strong>
     *italic*              ->  <em>   (single star; snake_case is untouched
                                       because italics use * not _)
     `code`                ->  <code>
   Plain prose with none of these is simply escaped, so this is a drop-in
   replacement for esc() in prose contexts. */
function inlineMarkup(s){
  var e = esc(s);
  e = e.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(m, label, url){
    return '<a class="ilink" href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
  });
  e = e.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');       /* bold before italic */
  e = e.replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*/g, '$1<em>$2</em>'); /* remaining single stars */
  e = e.replace(/`([^`]+)`/g, '<code>$1</code>');
  return e;
}

/* Page-level document provenance. Kept as a pure string builder so the URL
   safety and separator rules stay independently testable without a DOM. */
function generatedFromHTML(source){
  if (!source || typeof source !== 'object' || Array.isArray(source) ||
      typeof source.url !== 'string') return '';
  var label = typeof source.label === 'string' ? source.label : 'source document';
  var shown = esc(label);
  if (/^https?:\/\//i.test(source.url)){
    shown = '<a href="' + esc(source.url) + '" target="_blank" rel="noopener">' + shown + '</a>';
  }
  var parts = [shown];
  if (typeof source.version === 'string') parts.push(esc(source.version));
  if (typeof source.at === 'string') parts.push(esc(source.at));
  return '<p class="generated-from">Generated from ' + parts.join(' · ') + '</p>';
}

/* bullets, with optional nesting. Each item is a string, or an object
   {text, sub:[...items], revealAt?, hideAt?} whose sub-list renders as an indented child <ul>.
   Recursive so the source doc's nested bullet structure carries over. Pure
   string builder (no DOM) so node tests cover it. */
function bulletsHTML(items, markTop){
  /* markTop: tag top-level items with their spec index (workbench
     click-to-definition); sub-lists stay unmarked so a click inside one
     resolves to its top-level parent */
  if (!Array.isArray(items) || !items.length) return '';
  var h = '<ul class="sec-bullets">';
  items.forEach(function(b, i){

    var cur = replicaCursor(s), delta = ref && cur && ref.series === cur.series ? cur.position-ref.position : null;

      role:typeof s.role === 'string' ? s.role : '', observedAt:typeof s.observedAt === 'string' ? s.observedAt : '',
      status:REPLICA_STATUSES.indexOf(s.status) >= 0 ? s.status : 'unknown',
      lagMs:isFiniteNum(s.lagMs) && s.lagMs >= 0 ? s.lagMs : null,
      delta:delta, comparison:delta !== null ? (delta === 0 ? 'equal' : delta < 0 ? 'behind' : 'ahead') :
        !cur ? 'unknown' : !ref ? 'no-reference' : 'different-series'};

  return {reference:ref, rows:rows, comparable:comparable.length, min:min, max:max,
    referencePct:ref ? pct(ref.position) : null, unit:unit, note:typeof state.note === 'string' ? state.note : ''};

function wirePresenter(ctl, view, win){

    doc.body.classList.add('presenting');
    btn.textContent = 'EXIT';

  }

    doc.body.classList.remove('presenting');
    btn.textContent = 'PRESENT';
    if (doc.fullscreenElement && doc.exitFullscreen) doc.exitFullscreen().catch(function(){});
  }
  btn.addEventListener('click', function(){ presenting() ? exit() : enter(); });
  doc.addEventListener('fullscreenchange', function(){
    if (!doc.fullscreenElement && presenting()){
      doc.body.classList.remove('presenting');
      btn.textContent = 'PRESENT';
    }
  });

    if (!presenting()) return;
    var sp = ctl.activeStepper ? ctl.activeStepper() : null;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft'){
      if (!sp) return;
      if (sp.mode() !== 'step') sp.enterStep(false);
      sp.advance(sp.current().n + (ev.key === 'ArrowRight' ? 1 : -1));

    var st = parseHash(window.location.hash);
    if (st.d == null && (st.m != null || st.s != null)){
      try {
        history.replaceState(null, '',
          '#' + window.location.hash.replace(/^#/, '') +
          '&d=' + encodeURIComponent(embedRequest.section));
      } catch (ex){ /* sandboxed iframes may deny history writes */ }
    }
  }
  var preservedHash = embedRequest ?
    'embed=' + encodeURIComponent(String(embedRequest.section)) +
    (embedRequest.skin ? '&sk=' + encodeURIComponent(embedRequest.skin) : '') : null;
  deepLinkChannel = wireDeepLinks(ctl, window, preservedHash); /* tabs, every diagram/step, contract cards + rows */
  applyEmbedMode(ctl);
  if (pendingLinkBase){
    deepLinkChannel.receiveLinkBaseMessage(pendingLinkBase);
    pendingLinkBase = null;
  }
  wirePresenter(ctl, view, window);
}

var raw = null, parseErr = null;
try {
  raw = JSON.parse(document.getElementById('flowspec').textContent);
} catch (ex){
  parseErr = 'JSON parse: ' + ex.message;
}
var specParam = /[?&]spec=([^&#]+)/.exec(window.location.search);
var isDemo = !!(raw && raw.page && raw.page.__demo);

if (specParam && (isDemo || parseErr)){
  applySkinClasses(document.body, view, resolveSkin(readCookieText()));
  var specUrl = decodeURIComponent(specParam[1]);
  fetch(specUrl).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(boot).catch(function(ex){
    fail(['?spec fetch "' + specUrl + '": ' + ex.message,
          'The ?spec= mode works only on http(s)-served pages — file:// cannot fetch.',
          'For a file that opens anywhere, inject the spec instead: tools/inject.py <spec.json> <template> <out.html>.']);
  });
} else if (parseErr){
  fail([parseErr]);
} else {
  boot(raw);
}
})();
</script>
