<style>
/* style.flowview.css — page chrome for the standalone render target. */
body{margin:0; font:15px/1.6 'IBM Plex Sans',system-ui,sans-serif; background:#0B1220;}
body.sk-aurora{background:#0B1220;}
body.sk-daylight{background:#F4F2EC;}
.docview{max-width:1240px; margin:0 auto; padding:34px 26px 60px;}
.docview.sk-aurora{--dtext:#B9C7DD; --dink:#EAF2FF; --dfaint:#7E93B8;}
.docview.sk-daylight{--dtext:#4A4F58; --dink:#23272E; --dfaint:#79808B;}
.doc-title{font-family:'Sora',sans-serif; font-weight:700; font-size:26px; color:var(--dink); margin:0 0 4px;}
.doc-sub{font:500 11px 'IBM Plex Mono',monospace; color:var(--dfaint); margin:0;}
.errbox{font:500 12px/1.6 'IBM Plex Mono',monospace; color:#FF8B7A; background:#1A0F12;
  border:1px solid #5A2A22; border-radius:10px; padding:14px 16px; white-space:pre-wrap;}
.tabbtn:focus-visible, .mbtn:focus-visible, .tbtn:focus-visible, .schip:focus-visible{outline:2px solid #63D9F5; outline-offset:2px;}
/* style.core.css — shared doc/board/widget styles for both built pages. */
:root{--delta:#2FBF71;}
.tabbar{display:flex; gap:6px; flex-wrap:wrap; margin-top:24px;}
.tabunit{display:inline-flex; align-items:stretch; gap:3px;}
.tabbtn{font:600 12px 'IBM Plex Mono',monospace; padding:7px 14px; border-radius:8px; cursor:pointer;}
.sk-aurora .tabbtn{background:#101A2C; border:1px solid #25364F; color:#7E93B8;}
.sk-aurora .tabbtn[aria-selected="true"]{border-color:#38E1FF; color:#8AE8FF; background:#0C2230;}
.sk-daylight .tabbtn{background:#FFFFFF; border:1px solid #E0DCD1; color:#6B6F7A;}
.sk-daylight .tabbtn[aria-selected="true"]{border-color:#4956C9; color:#4956C9; background:#EEF0FB;}
/* highlighted tab (opt-in via tab.highlight); --hl defaults to violet */
.tabbtn.hl::before{content:"\25CF"; font-size:7px; margin-right:6px; vertical-align:middle;
  color:var(--hl,#A78BFA);}
.sk-aurora .tabbtn.hl{border-color:color-mix(in srgb, var(--hl,#A78BFA) 55%, transparent);
  color:#CBB8F5; box-shadow:0 0 0 1px color-mix(in srgb, var(--hl,#A78BFA) 22%, transparent);}
.sk-aurora .tabbtn.hl[aria-selected="true"]{border-color:var(--hl,#A78BFA); color:#E4D8FF;
  background:color-mix(in srgb, var(--hl,#A78BFA) 16%, #101A2C);}
.sk-daylight .tabbtn.hl{border-color:color-mix(in srgb, var(--hl,#7C3AED) 45%, #E0DCD1); color:#6D28D9;}
.sk-daylight .tabbtn.hl[aria-selected="true"]{border-color:var(--hl,#7C3AED); color:#6D28D9;
  background:color-mix(in srgb, var(--hl,#7C3AED) 12%, #FFFFFF);}
.tabpanel{margin-top:2px;}

.doc-sec{margin-top:22px; border-radius:14px; padding:18px 20px 20px;
  border:1.5px solid color-mix(in srgb, var(--acc) 45%, transparent);
  background:color-mix(in srgb, var(--acc) 7%, transparent);}
.sec-eyebrow{font:600 10.5px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase;
  color:var(--acc); margin:0 0 2px;}
.sk-daylight .sec-eyebrow{color:color-mix(in srgb, var(--acc) 60%, #1B2027);}
.sec-h{font-family:'Sora',sans-serif; font-weight:600; font-size:18px; color:var(--dink); margin:2px 0 8px;}
.sec-heading-row{display:flex; align-items:flex-start; gap:8px;}
.sec-heading-row .sec-h{flex:1; min-width:0;}
.sec-heading-row-eyebrow{align-items:center;}
.sec-heading-row-eyebrow .sec-eyebrow{flex:1; min-width:0;}
.prosetoggle{display:inline-flex; flex:0 0 auto; align-items:center; justify-content:center;
  width:24px; height:24px; margin:0; padding:0; border:1px solid; border-radius:6px;
  background:transparent; cursor:pointer; opacity:.72;}
.prosetoggle:hover{opacity:1;}
.prosetoggle:focus-visible{outline:2px solid currentColor; outline-offset:2px; opacity:1;}
.prosechev{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; transition:transform .18s ease;}
.prosetoggle[aria-expanded="false"] .prosechev{transform:rotate(-90deg);}
.sk-aurora .prosetoggle{color:#63D9F5; border-color:#294658; background:#101A2C;}
.sk-aurora .prosetoggle:hover{color:#B5F0FF; border-color:#63D9F5; background:rgba(99,217,245,.14);}
.sk-daylight .prosetoggle{color:#4956C9; border-color:#C9CDE9; background:#FFFFFF;}
.sk-daylight .prosetoggle:hover{color:#2A33A0; border-color:#4956C9; background:#EEF0FB;}
.sec-prose[hidden]{display:none;}
/* collapsed-prose teaser: one clamped line of the first paragraph/bullet
   plus a fixed "(expand for more)" suffix; clicking expands the prose */
.sec-teaser{display:flex; align-items:baseline; gap:8px; margin:0 0 8px; max-width:88ch; cursor:pointer;}
.sec-teaser[hidden]{display:none;}
.teasertext{flex:0 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  color:var(--dtext); font-size:14px;}
.teasermore{flex:none; color:var(--dfaint); font:500 11px 'IBM Plex Mono',monospace; letter-spacing:.02em;}
.sec-teaser:hover .teasermore{color:var(--dtext);}
.sec-text{color:var(--dtext); font-size:14px; max-width:88ch; margin:0 0 8px;}
.sec-bullets{color:var(--dtext); font-size:13.5px; margin:0 0 8px; padding-left:20px;}
.sec-bullets li{margin:3px 0;}
.sec-bullets .sec-bullets{margin:3px 0 5px;}       /* nested sub-bullets */
.sec-bullets .sec-bullets{font-size:13px;}
/* In step mode, fragment bullets/contract rows retain layout space while
   hidden; SVG edge fragments use the same class and are therefore undrawn. */
.dv-fragment-hidden{visibility:hidden !important;}

.boardgrid{display:block;}
.docview .boardgrid[hidden],.section-layout-grid[hidden]{display:none !important;}
.section-layout-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:32px;gap:8px;margin-top:12px;}
.section-layout-tile{grid-column:var(--tile-x)/span var(--tile-w);grid-row:var(--tile-y)/span var(--tile-h);min-width:0;min-height:0;position:relative;}
.docview .section-layout-tile>.pwidget{box-sizing:border-box;width:100%;height:100%;max-width:none;margin:0;overflow:auto;}
.section-layout-tile>.diagramcol{display:flex;flex-direction:column;height:100%;min-height:0;overflow:auto;}
.section-layout-tile .board{flex:1;min-height:80px;margin:0;}
.section-layout-tile .boardcanvas>svg{height:auto;width:100%;min-width:0;}
.section-layout-tile .termbar{flex:none;max-height:50%;overflow:auto;margin:0;}
.section-layout-tile[data-layout-key="steps"]>.termbar{box-sizing:border-box;height:100%;max-height:none;border-radius:12px;align-content:flex-start;}
.section-steps-placeholder{box-sizing:border-box;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;border:1px dashed var(--acc);border-radius:12px;color:var(--dfaint);font:12px 'IBM Plex Sans',sans-serif;}
.section-layout-tile:has(>.termbar:not([hidden]))>.section-steps-placeholder{display:none;}
.docview .section-layout-tile>.pt-homemap{display:flex;flex-direction:column;}
.section-layout-tile>.pt-homemap>.ptitle{flex:none;}
.section-layout-tile>.pt-homemap>.pbody{flex:1;min-height:0;}
.section-layout-tile .hmframe{height:100%;max-height:100%;}
@container diagram-section (max-width:640px){
  .section-layout-grid{display:flex;flex-direction:column;}
  .section-layout-tile{height:clamp(160px,calc(var(--tile-h)*40px - 8px),600px);flex:none;}
  .section-layout-tile:has(>.pt-homemap){height:auto;}
  .section-layout-tile .hmframe{height:auto;}
}
@media print{
  .section-layout-grid{display:block;}
  .section-steps-placeholder{display:none;}
  .section-layout-tile,.section-layout-tile>.diagramcol,.section-layout-tile[data-layout-key="steps"]>.termbar,.docview .section-layout-tile>.pwidget{height:auto;overflow:visible;margin-bottom:12px;}
}
.boardgrid.haspanels{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; align-items:start;}
.boardgrid.haspanels > .diagramcol{min-width:0;}
.boardgrid.haspanels > .panelcol{align-self:start;min-width:0;}
@media (max-width:980px){ .boardgrid.haspanels{grid-template-columns:1fr;} }
/* A section can be much narrower than the viewport or its document, e.g.
   beside the workbench editor. Measure its actual diagram/panel space. */
.docview{container-type:inline-size;}
.doc-sec{container:diagram-section / inline-size;}

.board{--dv-board-ground:#0B1220; margin-top:12px; border-radius:12px; overflow-x:auto;
  border:1px solid color-mix(in srgb, var(--acc) 30%, transparent);}
.sk-daylight .board{--dv-board-ground:#FBFAF6;}
.board.stepmode{border-bottom-left-radius:0; border-bottom-right-radius:0;}
.boardcanvas{position:relative;}
.board svg{display:block; min-width:980px; width:100%; height:auto;}
/* when a panel column shares the row the board is only ~670-860px wide, so the
   980px floor would force a horizontal scrollbar; let the svg scale to fit
   (panels move below it when the section no longer has room for both). */
.boardgrid.haspanels .board svg{min-width:0;}
.diagramcol{container-type:inline-size;}
.board.board-size-readable .boardcanvas svg{min-width:1180px;}
.board.board-size-fit .boardcanvas svg,.board.board-size-auto .boardcanvas svg{min-width:0;}
.board-size{display:flex;flex-wrap:wrap;align-items:center;gap:5px;flex-basis:100%;font:11px 'IBM Plex Mono',monospace;color:var(--dtext);}
.board-size>span:first-child{margin-right:3px;}
.board-scroll-hint{display:none;flex-basis:100%;font-size:10px;color:var(--dfaint);}
.board-overflow .board-scroll-hint{display:block;}
.board:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
@media screen{
  @container(max-width:640px){
    .board.board-size-auto .boardcanvas svg{min-width:1180px;}
  }
}
@media print{
  .board.board-size-readable .boardcanvas svg{min-width:0;}
  .board-size{display:none;}
}
.lg{position:sticky; left:0; display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:10px 14px;}
.sk-aurora .lg{background:#0B1220; border-bottom:1px dashed #25364F;}
.sk-daylight .lg{background:#FBFAF6; border-bottom:1px dashed #E0DCD1;}
.lg .li{display:flex; gap:7px; align-items:center; font:500 12px 'IBM Plex Mono',monospace;}
.sk-aurora .lg .li{color:#93A7C9;}
.sk-daylight .lg .li{color:#6B6F7A;}
.lg .li svg{display:block; width:40px; height:10px; min-width:40px;}
.mtoggle{margin-left:auto; display:flex; gap:6px;}
.mbtn{font:600 11px 'IBM Plex Mono',monospace; padding:5px 10px; border-radius:7px; cursor:pointer;}
.sk-aurora .mbtn{background:#101A2C; border:1px solid #25364F; color:#7E93B8;}
.sk-aurora .mbtn[aria-pressed="true"]{border-color:#38E1FF; color:#8AE8FF; background:#0C2230;}
.sk-daylight .mbtn{background:#FFFFFF; border:1px solid #E0DCD1; color:#6B6F7A;}
.sk-daylight .mbtn[aria-pressed="true"]{border-color:#4956C9; color:#4956C9; background:#EEF0FB;}

/* ---------- board internals, per skin ---------- */
.edge{fill:none; stroke-linecap:round;}
/* Crossing separators must erase to the actual board ground in every skin. */
.lane-bridge{fill:none;stroke:var(--dv-board-ground);stroke-width:7;stroke-linejoin:round;pointer-events:none;}
.edge.main{stroke-width:2.2;}
.edge.retm{stroke-width:1.9;}
.halo{fill:none; stroke-width:9; stroke-linecap:round; opacity:.13;}
.sk-aurora .dv-protocol-stroke{stroke:var(--dv-aurora);}
.sk-daylight .dv-protocol-stroke{stroke:var(--dv-daylight);}
.sk-aurora .dv-protocol-fill{fill:var(--dv-aurora);}
.sk-daylight .dv-protocol-fill{fill:var(--dv-daylight);}
.dv-board-ground{fill:var(--dv-board-ground);}
.sk-daylight .dv-board-grid, .sk-daylight .halo{display:none;}
.sk-aurora .pkt{r:4px; filter:drop-shadow(0 0 6px var(--dv-aurora));}
.sk-daylight .pkt{r:3.4px; filter:none;}
@keyframes dash16{to{stroke-dashoffset:-16;}}
@keyframes dash20{to{stroke-dashoffset:-20;}}
.sk-aurora .edge.main{animation:dash16 .9s linear infinite;}
.sk-aurora .edge.retm{animation:dash20 1.7s linear infinite;}
.sk-daylight .edge.main{animation:dash16 2.1s linear infinite;}
.sk-daylight .edge.retm{animation:dash20 3.4s linear infinite;}
.cpkt{visibility:hidden;}

.t1{font:600 13.5px 'IBM Plex Sans',sans-serif;}
.t2{font:500 10.5px 'IBM Plex Mono',monospace;}
.lbl{font:500 11.5px 'IBM Plex Mono',monospace;}
.coin text{font:700 11px 'IBM Plex Mono',monospace;}
.icbg{fill:currentColor; opacity:.13;}

/* containment groups (a device boundary drawn around member nodes) */
.grpbox{fill:none; stroke-dasharray:7 6; stroke-width:1.4; rx:14;}
.sk-aurora .grpbox{stroke:#3A4C68; fill:rgba(56,225,255,.025);}
.sk-daylight .grpbox{stroke:#C9C2B2; fill:rgba(73,86,201,.03);}
.grptitle{font:600 10.5px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase;}
.sk-aurora .grptitle{fill:#5E7396;}
.sk-aurora .grpicon{color:#5E7396;}
.sk-daylight .grptitle{fill:#8A8474;}
.sk-daylight .grpicon{color:#8A8474;}

/* permalink + derived sibling affordances — zero footprint when absent */
.nlink,.nbackref{cursor:pointer;}
.nlink text,.nbackref text{font:700 12px 'IBM Plex Mono',monospace;}
.sk-aurora .nlink text,.sk-aurora .nbackref text{fill:#63D9F5;}
.sk-aurora .nlink:hover text,.sk-aurora .nbackref:hover text,.sk-aurora .nbackref:focus text{fill:#B5F0FF;}
.sk-daylight .nlink text,.sk-daylight .nbackref text{fill:#4956C9;}
.sk-daylight .nlink:hover text,.sk-daylight .nbackref:hover text,.sk-daylight .nbackref:focus text{fill:#2A33A0;}
.nbackref:focus{outline:none;}
.nbackref:focus-visible circle{stroke:currentColor;stroke-width:1.5;}
.nbackpop{position:fixed;z-index:1000;box-sizing:border-box;width:max-content;max-width:min(360px,calc(100vw - 16px));
  display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 8px;border-radius:8px;
  font:600 9px/1.4 'IBM Plex Mono',monospace;box-shadow:0 8px 24px rgba(0,0,0,.24);}
.nbackpop[hidden]{display:none;}
.nbacklabel{letter-spacing:.06em;text-transform:uppercase;}
.nbacklink{padding:2px 7px;border:1px solid;border-radius:999px;text-decoration:none;}
.sk-aurora .nbackpop{color:#93A7C9;background:#101A2C;border:1px solid #294658;}
.sk-aurora .nbacklink{color:#8AE8FF;border-color:#294658;background:#0B1220;}
.sk-aurora .nbacklink:hover,.sk-aurora .nbacklink:focus{color:#EAF2FF;border-color:#63D9F5;}
.sk-daylight .nbackpop{color:#6B6F7A;background:#FFFFFF;border:1px solid #C9CDE9;}
.sk-daylight .nbacklink{color:#4956C9;border-color:#C9CDE9;background:#EEF0FB;}
.sk-daylight .nbacklink:hover,.sk-daylight .nbacklink:focus{color:#2A33A0;border-color:#4956C9;}
.nrefs-trigger:focus-visible circle{stroke:currentColor;stroke-width:1.5;}
.node-link-menu{inset:auto;margin:0;width:320px;max-height:min(420px,calc(100dvh - 16px));overflow:auto;flex-direction:column;align-items:stretch;gap:7px;padding:12px;font-size:12px;}
.node-link-menu .node-link-title{padding-right:28px;font-size:14px;overflow-wrap:anywhere;}
.node-link-menu .nbacklabel{margin-top:5px;font-size:10px;}
.node-link-menu .node-reference-link{padding:9px 10px;border-radius:6px;overflow-wrap:anywhere;}
.node-link-close{position:absolute;right:5px;top:5px;width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:inherit;font-size:22px;cursor:pointer;}
.node-link-menu :focus-visible{outline:2px solid currentColor;outline-offset:2px;}
.srcchip{font:600 10px 'IBM Plex Mono',monospace; text-decoration:none; padding:2px 8px; border-radius:999px;
  border:1px solid color-mix(in srgb, var(--acc) 45%, transparent); color:var(--acc); margin-left:10px; vertical-align:2px;}
.sk-daylight .srcchip{color:color-mix(in srgb, var(--acc) 60%, #1B2027);}
.srcchip:hover{background:color-mix(in srgb, var(--acc) 12%, transparent);}
.copychip{display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; padding:0; border:0; background:none; border-radius:5px;
  cursor:pointer; vertical-align:middle; opacity:.62;}
/* visually hidden live region: announces copy success/failure to assistive
   tech, since the icon swap is aria-hidden */
.copystatus{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;}
.copychip:hover,.copychip:focus-visible{opacity:1;}
.sk-aurora .copychip{color:#63D9F5;}
.sk-aurora .copychip:hover{color:#B5F0FF; background:rgba(99,217,245,.14);}
.sk-daylight .copychip{color:#4956C9;}
.sk-daylight .copychip:hover{color:#2A33A0; background:#EEF0FB;}
.sk-aurora .copychip.ok{color:#4FD68C; opacity:1;}
.sk-daylight .copychip.ok{color:#1F8A4C; opacity:1;}
.sk-aurora .copychip.err{color:#FF7A6E; opacity:1;}
.sk-daylight .copychip.err{color:#C2352B; opacity:1;}
.copychip:focus-visible{outline:2px solid currentColor; outline-offset:2px;}
.copyfallback{box-sizing:border-box; min-width:240px; max-width:min(560px,70vw); padding:4px 7px;
  font:500 10px 'IBM Plex Mono',monospace; border-radius:5px;}
.sk-aurora .copyfallback{color:#EAF2FF; background:#101A2C; border:1px solid #FFB454;}
.sk-daylight .copyfallback{color:#1B2027; background:#FFFFFF; border:1px solid #B45309;}
.copyfallback:focus{outline:2px solid currentColor; outline-offset:1px;}
.tabcopy{border-radius:7px;}
.stepcopy{float:right; margin-left:10px;}
.steplink{font:500 11px 'IBM Plex Mono',monospace; margin-left:10px; text-decoration:none;}
.sk-aurora .steplink{color:#63D9F5;}
.sk-daylight .steplink{color:#4956C9;}
.steplink:hover{text-decoration:underline;}
/* inline prose links (markdown [label](url) in text/bullets/notes) */
.ilink{text-decoration:underline; text-underline-offset:2px;}
.sk-aurora .ilink{color:#63D9F5;}
.sk-aurora .ilink:hover{color:#B5F0FF;}
.sk-daylight .ilink{color:#3B45B8;}
.sk-daylight .ilink:hover{color:#2A33A0;}

.sk-aurora .card{fill:#101A2C; stroke:#25364F; stroke-width:1.2;}
.sk-aurora .t1{fill:#EAF2FF;}
.sk-aurora .t2{fill:#7E93B8;}
.sk-aurora .lbl{fill:#93A7C9;}
.sk-aurora .coin circle{fill:#0C1526; stroke:#63D9F5; stroke-width:1.4;}
.sk-aurora .coin text{fill:#8AE8FF;}
.sk-aurora .tint-cmd{color:#38E1FF;} .sk-aurora .tint-auth{color:#FFB454;}
.sk-aurora .tint-data{color:#A78BFA;} .sk-aurora .tint-mqtt{color:#F471B5;}
.sk-aurora .tint-dev{color:#4ADE80;}

.sk-daylight .card{fill:#FFFFFF; stroke:#E0DCD1; stroke-width:1.2; filter:drop-shadow(0 1px 2px rgba(40,36,22,.10));}
.sk-daylight .t1{fill:#23272E;}
.sk-daylight .t2{fill:#79808B;}
.sk-daylight .lbl{fill:#6B6F7A;}
.sk-daylight .coin circle{fill:#4956C9;}
.sk-daylight .coin text{fill:#FFFFFF;}
.sk-daylight .tint-cmd{color:#4956C9;} .sk-daylight .tint-auth{color:#B0771A;}
.sk-daylight .tint-data{color:#7C5CC4;} .sk-daylight .tint-mqtt{color:#C2417E;}
.sk-daylight .tint-dev{color:#0E9382;}

/* ---------- inspector panels ---------- */
.swpanel{color:var(--dtext); font:12px/1.5 'IBM Plex Sans',system-ui,sans-serif; overflow-wrap:anywhere;}
.replicas-view{color:var(--dtext);font:11px/1.5 'IBM Plex Mono',monospace;overflow-wrap:anywhere;}
.rep-reference{padding:8px;border:1px solid currentColor;border-radius:6px;margin-bottom:8px;}
.rep-reference b,.rep-head b{color:var(--dink);}
.rep-scale,.rep-note,.rep-observed,.rep-series{font-size:10px;color:var(--dfaint);}
.rep-list{max-height:480px;overflow:auto;}
.rep-list:focus-visible{outline:2px solid var(--dink);outline-offset:-2px;}
.rep-row{padding:10px 2px;border-bottom:1px solid color-mix(in srgb,var(--dtext) 22%,transparent);}
.rep-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.rep-status{font-size:9px;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 4px;}
.rep-role{font-size:10px;}.rep-value{margin-top:5px;font-weight:600;}
.rep-track{position:relative;height:18px;margin:4px 6px;background:linear-gradient(transparent 8px,currentColor 8px,currentColor 9px,transparent 9px);}
.rep-reference-mark{position:absolute;top:0;height:18px;border-left:2px dashed currentColor;opacity:.55;}
.rep-position-mark{position:absolute;top:4px;width:9px;height:9px;border-radius:50%;background:var(--dink);transform:translateX(-50%);}
.rep-comparison{font-weight:600;}.rep-note{margin:9px 0 0;}
@media print{
  .panelcol .pwidget.pt-replicas{display:block !important;break-inside:avoid;}
  .panelcol:has(.pt-replicas){display:flex !important;}
  .rep-list{max-height:none;overflow:visible;}
  .replicas-view{color:#222;--dink:#111;--dfaint:#555;}
}
.wf-timed{max-height:350px; overflow:auto;}
.wf-timed .wflabel{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wfrow.wf-error .wfbar{background:#DD5A65;}
.wfrow.wf-error .wfms{font-weight:700; text-decoration:underline dotted;}
.swtablewrap{overflow:auto; max-height:300px; border:1px solid color-mix(in srgb,var(--dtext) 20%,transparent); border-radius:6px;}
.swtablewrap:focus-visible{outline:2px solid var(--dink); outline-offset:2px;}
.swtable{width:100%; border-collapse:collapse; font:11px/1.5 'IBM Plex Mono',monospace; text-align:left;}
.swtable th,.swtable td{padding:7px 8px; border-bottom:1px solid color-mix(in srgb,var(--dtext) 14%,transparent); vertical-align:top;}
.swtable th{font-size:10px; color:var(--dink);}
.swtable td{min-width:45px; max-width:180px;}
.swtable tr:last-child td{border-bottom:0;}
.swcaption{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);}
.swrow-added{background:color-mix(in srgb,var(--dtext) 5%,transparent);}
.swrow-changed{background:color-mix(in srgb,var(--dtext) 9%,transparent);}
.swrow-removed td:not(:last-child){text-decoration:line-through; opacity:.7;}
.swbadge{display:inline-block; border:1px solid currentColor; border-radius:4px; padding:1px 5px; font:600 9px/1.5 'IBM Plex Mono',monospace; text-transform:uppercase; white-space:nowrap;}
.sw-pass,.sw-added{color:#5EDAA0;}
.sw-fail,.sw-removed{color:#FF9494;}
.sw-warn,.sw-changed{color:#EEC16A;}
.sw-pending,.sw-skip,.sw-neutral{color:var(--dfaint);}
:is(.sk-daylight,.sk-editorial,.sk-pastel,.sk-blueprint) .sw-pass,:is(.sk-daylight,.sk-editorial,.sk-pastel,.sk-blueprint) .sw-added{color:#18724C;}
:is(.sk-daylight,.sk-editorial,.sk-pastel,.sk-blueprint) .sw-fail,:is(.sk-daylight,.sk-editorial,.sk-pastel,.sk-blueprint) .sw-removed{color:#B32938;}
:is(.sk-daylight,.sk-editorial,.sk-pastel,.sk-blueprint) .sw-warn,:is(.sk-daylight,.sk-editorial,.sk-pastel,.sk-blueprint) .sw-changed{color:#865B06;}
.swsummary,.swcheckhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.swsummary{color:var(--dink); font-weight:600; margin-bottom:8px;}
.swsummary span{font-size:10px; color:var(--dfaint); font-weight:400;}
.swchecks{list-style:none; margin:0; padding:0; max-height:300px; overflow:auto;}
.swchecks li,.swmetric{padding:8px 0; border-bottom:1px solid color-mix(in srgb,var(--dtext) 14%,transparent);}
.swchecks li:last-child,.swmetric:last-child{border-bottom:0;}
.swcheckhead>span:first-child{color:var(--dink); font-weight:600;}
.swdetail,.swnote,.swempty{font-size:11px; color:var(--dfaint); margin-top:4px;}
.swnote{padding-top:8px; border-top:1px solid color-mix(in srgb,var(--dtext) 14%,transparent);}
.swmeasure{font:11px/1.6 'IBM Plex Mono',monospace; margin:4px 0 6px;}
.swmeasure strong{font-size:19px; color:var(--dink);}
.swtrack{height:7px; border-radius:4px; position:relative; background:color-mix(in srgb,var(--dtext) 12%,transparent);}
.swfill{height:100%; border-radius:4px; background:currentColor;}
.swthreshold{position:absolute; top:-3px; height:13px; border-left:1px dashed var(--dink);}
@media print{
  .panelcol .pwidget.pt-table,.panelcol .pwidget.pt-checks,.panelcol .pwidget.pt-budget{display:block !important; break-inside:avoid;}
  .panelcol:has(.pt-table),.panelcol:has(.pt-checks),.panelcol:has(.pt-budget){display:flex !important;}
  .swtablewrap,.swchecks{max-height:none; overflow:visible;}
  .swbadge{color:inherit;}
}
.panelcol{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.pwidget{border-radius:12px; padding:12px 14px;}
.sk-aurora .pwidget{background:#0B1220; border:1px solid #25364F;}
.sk-daylight .pwidget{background:#FFFFFF; border:1px solid #E0DCD1;}
.ptitle{font:600 10.5px 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px;}
.sk-aurora .ptitle{color:#5E7396;}
.sk-daylight .ptitle{color:#8A8474;}
.preadout{font:700 20px 'IBM Plex Mono',monospace; margin-bottom:8px;}
.sk-aurora .preadout{color:#EAF2FF;}
.sk-daylight .preadout{color:#23272E;}
.prail{display:flex; flex-wrap:wrap; gap:4px;}
.pchip{font:600 9.5px 'IBM Plex Mono',monospace; padding:3px 7px; border-radius:6px; border:1px solid transparent;}
.sk-aurora .pchip{background:#101A2C; color:#55627A; border-color:#1D2A40;}
.sk-aurora .pchip.cur{color:#8AE8FF; border-color:#38E1FF; background:#0C2230;}
.sk-daylight .pchip{background:#F4F2EC; color:#9A958A; border-color:#E0DCD1;}
.sk-daylight .pchip.cur{color:#4956C9; border-color:#4956C9; background:#EEF0FB;}
.ledrow{display:flex; flex-wrap:wrap; gap:12px;}
.led{display:flex; align-items:center; gap:6px; font:600 10.5px 'IBM Plex Mono',monospace;}
.sk-aurora .led{color:#93A7C9;}
.sk-daylight .led{color:#6B6F7A;}
.leddot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.leddot.off{background:#333D49;}
.leddot.on{background:#4ADE80; box-shadow:0 0 5px rgba(74,222,128,.8);}
.leddot.tx{background:#38E1FF; box-shadow:0 0 5px rgba(56,225,255,.8); animation:ledpulse .5s ease-in-out infinite alternate;}
.leddot.rx{background:#F471B5; box-shadow:0 0 5px rgba(244,113,181,.8); animation:ledpulse .5s ease-in-out infinite alternate;}
@keyframes ledpulse{to{opacity:.35;}}
.gaugeval{font:700 16px 'IBM Plex Mono',monospace; margin-bottom:6px;}
.sk-aurora .gaugeval{color:#EAF2FF;}
.sk-daylight .gaugeval{color:#23272E;}
.gaugeunit{font-size:11px; font-weight:500; opacity:.6;}
.gaugebar{height:8px; border-radius:4px; overflow:hidden;}
.sk-aurora .gaugebar{background:#101A2C;}
.sk-daylight .gaugebar{background:#F4F2EC;}
.gaugefill{height:100%; border-radius:4px; background:linear-gradient(90deg,#4ADE80,#FFB454,#F87171); transition:width .5s ease;}
.pchip.dv-chip-pulse{animation:dvchippulse .58s ease-out;}
.odot.dv-chip-pulse{transform-box:fill-box; transform-origin:center; animation:dvchippulse .58s ease-out;}
@keyframes dvchippulse{0%{transform:scale(1);} 38%{transform:scale(1.28);filter:brightness(1.45);} 100%{transform:scale(1);}}
/* FIXED height (not max-height): the log is the one widget whose content
   grows per step, and a growing panel shifts everything below it — including
   the step buttons. It scrolls internally; the engine keeps the newest lines
   in view. */
.plog{font:500 10.5px/1.7 'IBM Plex Mono',monospace; height:170px; overflow-y:auto;}
.sk-aurora .plog{color:#93A7C9;}
.sk-daylight .plog{color:#6B6F7A;}
.plogline{display:flex; gap:7px;}
.plogtag{font-weight:700; min-width:32px;}
.punknown{font:500 11px 'IBM Plex Mono',monospace; color:#B0771A;}

/* inflight widget: concurrency bars on a shared zero-based step axis */
.ifbox{font:500 9.5px 'IBM Plex Mono',monospace;}
.ifaxis,.ifrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:7px;align-items:center;}
.ifaxis{margin-bottom:3px;}
.ifaxislabel{text-transform:uppercase;letter-spacing:.08em;font-size:8.5px;opacity:.65;}
.ifticks{height:17px;position:relative;display:block;}
.iftick{position:absolute;top:0;transform:translateX(-50%);width:16px;height:16px;line-height:16px;
  text-align:center;border-radius:5px;opacity:.6;}
.iftick.cur{opacity:1;font-weight:700;}
.ifrow{min-height:25px;}
.iflabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.iftrack{position:relative;display:block;height:20px;border-radius:6px;overflow:hidden;}
.ifgrid,.ifnow{position:absolute;top:0;bottom:0;display:block;pointer-events:none;}
.ifgrid{width:1px;opacity:.5;}
.ifnow{z-index:0;}
.ifbar{position:absolute;z-index:1;top:3px;height:14px;line-height:14px;box-sizing:border-box;
  min-width:5px;padding:0 4px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:8px;font-weight:700;color:#08120C;
  transition:width .55s cubic-bezier(.4,0,.2,1), opacity .3s ease;}
.ifbar.s-ok{background:#4ADE80;}
.ifbar.s-retry{background:#FFB454;color:#2C1800;}
.ifbar.s-failed{background:#F87171;color:#2C0808;}
.ifbar.open{border-right:3px dotted rgba(0,0,0,.55);border-top-right-radius:1px;border-bottom-right-radius:1px;}
.ifempty{font:500 10.5px 'IBM Plex Mono',monospace;opacity:.65;}
.sk-aurora .ifaxis,.sk-aurora .iflabel{color:#93A7C9;}
.sk-aurora .iftick.cur{background:#0C2230;color:#8AE8FF;}
.sk-aurora .iftrack{background:#101A2C;border:1px solid #1D2A40;}
.sk-aurora .ifgrid{background:#31405A;}
.sk-aurora .ifnow{background:rgba(56,225,255,.08);}
.sk-daylight .ifaxis,.sk-daylight .iflabel{color:#6B6F7A;}
.sk-daylight .iftick.cur{background:#EEF0FB;color:#4956C9;}
.sk-daylight .iftrack{background:#F4F2EC;border:1px solid #E0DCD1;}
.sk-daylight .ifgrid{background:#D6D0C3;}
.sk-daylight .ifnow{background:rgba(73,86,201,.08);}

/* phone widget: generic lock-screen notification stack (no OS branding) */
.phoneframe{position:relative;box-sizing:border-box;width:178px;min-height:252px;margin:0 auto;padding:30px 11px 19px;
  overflow:hidden;border:2px solid;border-radius:25px;font:500 9px/1.25 'IBM Plex Mono',monospace;}
.phonespeaker{position:absolute;top:9px;left:50%;width:36px;height:4px;transform:translateX(-50%);border-radius:999px;}
.phonestatus{position:absolute;top:16px;left:13px;right:13px;display:flex;align-items:center;justify-content:space-between;
  height:11px;font-size:8px;font-weight:700;}
.phonebrand{display:flex;align-items:center;gap:5px;min-width:0;padding:3px 18px 0 0;}
.phonelogo{flex:0 0 18px;height:18px;border-radius:4px;text-align:center;font-size:6px;font-weight:800;line-height:18px;
  color:#FFFFFF;background:var(--phacc, #4956C9);}
.phonebrandname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700;
  color:var(--phfg, inherit);}
.phoneclock{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.phoneglyphs{display:flex;align-items:flex-end;gap:5px;}
.phonesignal{display:flex;align-items:flex-end;gap:1px;height:8px;}
.phonesignal i{display:block;width:2px;border-radius:1px;}
.phonesignal i:nth-child(1){height:3px;}.phonesignal i:nth-child(2){height:5px;}.phonesignal i:nth-child(3){height:8px;}
.phonebattery{position:relative;display:block;box-sizing:border-box;width:14px;height:7px;border:1px solid;border-radius:2px;}
.phonebattery::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;border-radius:0 1px 1px 0;background:currentColor;}
.phonebattery i{display:block;width:8px;height:3px;margin:1px;border-radius:1px;background:currentColor;}
.phonebadge{position:absolute;z-index:2;top:35px;right:8px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;
  border-radius:999px;text-align:center;font-size:8px;font-weight:800;line-height:17px;}
.phonecards{display:flex;flex-direction:column;gap:6px;min-height:181px;padding-top:8px;}
.phonecard{box-sizing:border-box;max-height:58px;padding:6px 8px;overflow:hidden;border:1px solid;border-radius:10px;}
.phonecard.fresh{animation:phonecardin .48s cubic-bezier(.2,.8,.2,1) both;}
@keyframes phonecardin{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
.phoneapp,.phonetitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.phoneapp{font-size:7.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.phonetitle{margin-top:2px;font-size:9px;font-weight:800;}
.phonetext{display:-webkit-box;margin-top:2px;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font:500 8px/1.25 'IBM Plex Sans',sans-serif;}
.phoneoverflow{text-align:center;font-size:8px;font-weight:700;letter-spacing:.04em;}
.phoneempty{margin:auto;text-align:center;font-size:8px;letter-spacing:.05em;text-transform:uppercase;opacity:.58;}
.phonehome{position:absolute;bottom:8px;left:50%;width:42px;height:3px;transform:translateX(-50%);border-radius:999px;}
.sk-aurora .phoneframe{color:var(--phfg, #D9E4F2);background:var(--phbg, #09111E);border-color:#718099;box-shadow:inset 0 0 0 2px #16233A;}
.sk-aurora .phonespeaker,.sk-aurora .phonehome{background:#718099;}
.sk-aurora .phonesignal i{background:#C7D3E3;}
.sk-aurora .phonebattery{color:#C7D3E3;border-color:#C7D3E3;}
.sk-aurora .phonecard{color:#DCE7F5;background:rgba(43,58,79,.92);border-color:#3A4B64;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.sk-aurora .phonecard.fresh{border-color:var(--phacc, #3A4B64);}
.sk-aurora .phoneapp,.sk-aurora .phoneoverflow{color:var(--phacc, #8AE8FF);}
.sk-aurora .phonetext{color:#B7C4D5;}
.sk-aurora .phonebadge{color:#07121D;background:var(--phacc, #8AE8FF);}
.sk-aurora .phonelogo{color:#07121D;background:var(--phacc, #8AE8FF);}
.sk-daylight .phoneframe{color:var(--phfg, #282B33);background:var(--phbg, #F2F0EA);border-color:#777B84;box-shadow:inset 0 0 0 2px #FFFFFF;}
.sk-daylight .phonespeaker,.sk-daylight .phonehome{background:#777B84;}
.sk-daylight .phonesignal i{background:#4E535D;}
.sk-daylight .phonebattery{color:#4E535D;border-color:#4E535D;}
.sk-daylight .phonecard{color:#272A32;background:rgba(255,255,255,.94);border-color:#D6D2C8;box-shadow:0 4px 12px rgba(45,42,35,.1);}
.sk-daylight .phonecard.fresh{border-color:var(--phacc, #D6D2C8);}
.sk-daylight .phoneapp,.sk-daylight .phoneoverflow{color:var(--phacc, #4956C9);}
.sk-daylight .phonetext{color:#5F626B;}
.sk-daylight .phonebadge{color:#FFFFFF;background:var(--phacc, #4956C9);}
.sk-daylight .phonelogo{color:#FFFFFF;background:var(--phacc, #4956C9);}

/* screen widget (viewfinder) */
.screenbox{position:relative; border-radius:8px; overflow:hidden; aspect-ratio:16/9; background:#05080B;}
.screenbox .scene{display:block; width:100%; height:100%;}
.screenbox.m-live .walker, .screenbox.m-rec .walker, .screenbox.m-save .walker{animation:walkin 3.2s ease-out forwards;}
@keyframes walkin{from{transform:translateX(40px);} to{transform:translateX(160px);}}
.screenbox .walker{transform:translateX(160px);}
/* package-drop choreography: the courier walks in carrying the box, the
   package appears at the drop beat, the courier leaves. Defaults are the
   reduced-motion end state: courier off-canvas, package delivered. */
.screenbox .courier{transform:translateX(-40px);}
.screenbox.m-live .courier, .screenbox.m-rec .courier, .screenbox.m-save .courier{animation:courierrun 5s ease-in-out forwards;}
@keyframes courierrun{0%{transform:translateX(-30px);} 42%{transform:translateX(238px);} 58%{transform:translateX(238px);} 100%{transform:translateX(-40px);}}
.screenbox.m-live .courier .carried, .screenbox.m-rec .courier .carried, .screenbox.m-save .courier .carried{animation:carrydrop 5s step-end forwards;}
@keyframes carrydrop{0%{opacity:1;} 50%{opacity:0;} 100%{opacity:0;}}
.screenbox.m-live .pkg, .screenbox.m-rec .pkg, .screenbox.m-save .pkg{animation:pkgdrop 5s ease-out forwards;}
@keyframes pkgdrop{0%,49%{opacity:0; transform:translateY(-6px);} 56%{opacity:1; transform:translateY(0);} 100%{opacity:1;}}
/* Door entry: all tracks share a clock and persist through live/rec/save.
   Unanimated defaults show the visitor crossing an open threshold. */
.screenbox .entry-person{transform-origin:0 155px;transform:translate(215px,-8px) scale(.83);}
.screenbox .entry-door{transform-origin:174px 28px;transform:skewY(-12deg) scaleX(.24);}
.screenbox .entry-leg{transform-origin:0 127px;}
.screenbox .entry-arm{transform-origin:0 106px;}
.screenbox:is(.m-live,.m-rec,.m-save) .entry-person{animation:entrycross 6.8s linear forwards;}
.screenbox:is(.m-live,.m-rec,.m-save) .entry-door{animation:entryopen 6.8s ease-in-out forwards;}
.screenbox:is(.m-live,.m-rec,.m-save) .entry-light{animation:entrylight 6.8s ease-in-out forwards;}
.screenbox:is(.m-live,.m-rec,.m-save) .entry-leg,
.screenbox:is(.m-live,.m-rec,.m-save) .entry-arm{animation:entrystride .68s ease-in-out 8 alternate;}
.screenbox:is(.m-live,.m-rec,.m-save) .entry-leg-back,
.screenbox:is(.m-live,.m-rec,.m-save) .entry-arm:not(.entry-arm-back){animation-direction:alternate-reverse;}
@keyframes entrycross{
  0%{transform:translate(22px,0) scale(1);opacity:1;}
  38%{transform:translate(185px,0) scale(1);opacity:1;}
  50%{transform:translate(208px,-2px) scale(.95);opacity:1;}
  69%{transform:translate(226px,-10px) scale(.76);opacity:1;}
  79%,100%{transform:translate(232px,-15px) scale(.65);opacity:0;}
}
@keyframes entryopen{
  0%,22%,100%{transform:skewY(0) scaleX(1);}
  40%,80%{transform:skewY(-12deg) scaleX(.24);}
}
@keyframes entrylight{0%,22%,100%{opacity:0;}40%,80%{opacity:.22;}}
@keyframes entrystride{from{transform:rotate(-17deg);}to{transform:rotate(17deg);}}
/* Doorbell perspective: runners recede down the path, then turn along the
   sidewalk. Finite tracks leave an empty porch without replaying the event.
   Base poses are mid-run stills for print and reduced motion. */
.screenbox .doorbell-runner{--runner-shirt:#F2A14F;--runner-sleeve:#CE753B;--runner-delay:0s;transform-origin:0 0;transform:translate(143px,125px) scale(.78);}
.screenbox .doorbell-runner-second{--runner-shirt:#58B8DB;--runner-sleeve:#367FB5;--runner-delay:.42s;transform:translate(186px,135px) scale(.88);}
.screenbox .doorbell-leg{transform-origin:0 -27px;transform:rotate(-12deg) scaleY(.65);}
.screenbox .doorbell-leg-back{transform:rotate(12deg);}
.screenbox .doorbell-arm{transform-origin:8px -46px;transform:rotate(-18deg);}
.screenbox .doorbell-arm-back{transform-origin:-8px -46px;transform:rotate(18deg);}
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-runner{animation:doorbellaway 7.2s linear var(--runner-delay) both;}
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-runner-second{animation-name:doorbellawaysecond;}
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-bounce{animation:doorbellbounce .32s ease-in-out var(--runner-delay) 23;}
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-leg{animation:doorbellstride .16s ease-in-out var(--runner-delay) 46 alternate;}
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-arm{animation:doorbellarms .16s ease-in-out var(--runner-delay) 46 alternate;}
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-leg-back,
.screenbox:is(.m-live,.m-rec,.m-save) .doorbell-arm:not(.doorbell-arm-back){animation-direction:alternate-reverse;}
@keyframes doorbellaway{
  0%{transform:translate(105px,180px) scale(1.35);}
  16%{transform:translate(130px,146px) scale(.98);}
  37%{transform:translate(154px,119px) scale(.66);}
  60%{transform:translate(170px,103px) scale(.42);}
  72%{transform:translate(180px,99px) scale(.33);}
  82%{transform:translate(220px,97px) scale(.3);}
  100%{transform:translate(339px,96px) scale(.27);}
}
@keyframes doorbellawaysecond{
  0%{transform:translate(213px,178px) scale(1.25);}
  16%{transform:translate(191px,149px) scale(1);}
  37%{transform:translate(177px,122px) scale(.68);}
  60%{transform:translate(168px,104px) scale(.43);}
  72%{transform:translate(156px,99px) scale(.33);}
  82%{transform:translate(109px,97px) scale(.3);}
  100%{transform:translate(-19px,96px) scale(.27);}
}
@keyframes doorbellbounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes doorbellstride{from{transform:rotate(-14deg) scaleY(.48);}to{transform:rotate(14deg) scaleY(1);}}
@keyframes doorbellarms{from{transform:rotate(-26deg);}to{transform:rotate(24deg);}}
/* Small local changes in the flames/light, never a flashing full frame. */
.screenbox .fire-flame{transform-origin:239px 105px;}
.screenbox .fire-glow{filter:blur(10px);}
.screenbox .fire-smoke{transform-origin:233px 72px;filter:blur(3px);}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-flame{animation:firebreathe 1.1s ease-in-out infinite alternate;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-middle{animation-duration:.83s;animation-delay:-.4s;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-core{animation-duration:.67s;animation-delay:-.2s;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-glow{animation:fireglow 2.2s ease-in-out infinite alternate;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-smoke{animation:firerise 3.8s ease-out infinite;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-smoke-late{animation-delay:-1.9s;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-ember{animation:fireember 2.6s ease-out infinite;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-ember-late{animation-delay:-1.3s;}
.screenbox:is(.m-live,.m-rec,.m-save) .fire-alarm{animation:fireglow 1.5s ease-in-out infinite alternate;}
@keyframes firebreathe{from{transform:scale(.96,.87) skewX(-3deg);}to{transform:scale(1.04,1.05) skewX(3deg);}}
@keyframes fireglow{from{opacity:.55;}to{opacity:1;}}
@keyframes firerise{0%{transform:translate(0,0) scale(.7);opacity:0;}20%{opacity:.9;}100%{transform:translate(-28px,-57px) scale(1.9);opacity:0;}}
@keyframes fireember{0%{transform:translate(0,0);opacity:0;}15%{opacity:.8;}100%{transform:translate(-12px,-45px);opacity:0;}}
/* A quiet scene can be live or recording before the story event begins.
   Removing this class starts the clip from its beginning; REC is outside
   .scene, so its indicator keeps running independently. */
.screenbox.scene-waiting .scene *{animation:none !important;}
.screenbox.scene-waiting :is(.walker,.courier,.pkg,.entry-person,.doorbell-runner,.fire-flame,.fire-glow,.fire-smoke,.fire-ember,.fire-alarm){visibility:hidden;}
.screenbox.scene-waiting .entry-door{transform:none;}
.screenbox.scene-waiting .entry-light{opacity:0;}
@media(prefers-reduced-motion:reduce){
  .screenbox :is(.scene-entry,.scene-doorbell,.scene-fire) *{animation:none !important;}
}
@media print{
  .screenbox :is(.scene-entry,.scene-doorbell,.scene-fire) *{animation:none !important;}
  .screenbox{print-color-adjust:exact;}
}
.screenbox.m-boot .flick{animation:flicker .18s steps(2) infinite;}
@keyframes flicker{50%{opacity:.3; transform:translateY(3px);}}
.ovl{position:absolute; font:700 10.5px 'IBM Plex Mono',monospace; letter-spacing:.08em;}
.offlabel{inset:0; display:flex; align-items:center; justify-content:center; color:#2E3A46;}
.livechip{top:8px; left:8px; color:#0B1220; background:#4ADE80; padding:2px 7px; border-radius:4px;}
.recchip{top:8px; left:8px; color:#FFB0A6; background:rgba(8,20,35,.8); padding:3px 6px; border-radius:5px; display:flex; align-items:center; gap:5px;}
.recdot{width:8px; height:8px; border-radius:50%; background:#FF3B30; animation:recblink 1s steps(1) infinite;}
@keyframes recblink{50%{opacity:.15;}}
.banner{left:0; right:0; bottom:0; text-align:center; padding:5px 0; color:#0B1220; background:#FFB454;}

/* waterfall widget: latency spans on one shared scale */
.wfall{display:flex; flex-direction:column; gap:5px;}
/* timeline widget: wall-clock axis, cadence beats, events, now cursor.
   Colors ride the per-skin docview text vars so every skin reads. */
.tlsvg{width:100%; display:block;}
.tlaxis{stroke:var(--dfaint); stroke-width:1.6; opacity:.6;}
.tltickline{stroke:var(--dfaint); stroke-width:1; opacity:.45;}
.tltick{font:8.5px 'IBM Plex Mono',monospace; fill:var(--dfaint);}
.tlbeat{fill:none; stroke:var(--dfaint); stroke-width:1.4;}
.tlbeat.past{fill:var(--dtext); stroke:var(--dtext);}
.tlelapsed{fill:var(--dfaint); opacity:.16;}
.tlev.tl-ok{fill:#34D399;}
.tlev.tl-alert{fill:#F87171;}
.tlev.tl-info{fill:var(--dtext);}
.tlevlab{font:8.5px 'IBM Plex Mono',monospace; fill:var(--dtext);}
.tlnow{stroke:var(--dink); stroke-width:1.6;}
.tlnowhead{fill:var(--dink);}
.tlband{fill:var(--dtext); opacity:.09;}
/* cadence lanes */
.tllane{font:8.5px 'IBM Plex Mono',monospace; fill:var(--dtext);}
.tlbadge{font:8.5px 'IBM Plex Mono',monospace; fill:var(--dfaint);}
.tlrowline{stroke:var(--dfaint); stroke-width:.7; opacity:.3;}
.tlcombline{stroke:var(--dtext); stroke-width:1;}
rect.tlpast{opacity:.6;}
rect.tlfuture{opacity:.18;}
.tlbandfill{fill:var(--dtext);}
.tlmiss{stroke:#F87171; stroke-width:2;}
.tlmissring{fill:none; stroke:#F87171; stroke-width:1.6;}
.tlzoom{stroke:var(--dfaint); stroke-width:1; stroke-dasharray:2 3; opacity:.55;}
.tlmeta{margin-top:4px; font:500 10px 'IBM Plex Mono',monospace; color:var(--dfaint);}

.wfrow{display:flex; align-items:center; gap:8px; opacity:.3; transition:opacity .3s ease;}
.wfrow.on{opacity:1;}
.wflabel{font:500 10.5px 'IBM Plex Mono',monospace; width:128px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sk-aurora .wflabel{color:#93A7C9;}
.sk-daylight .wflabel{color:#6B6F7A;}
.wftrack{flex:1; height:10px; border-radius:5px; display:block; overflow:hidden;}
.sk-aurora .wftrack{background:#101A2C;}
.sk-daylight .wftrack{background:#F4F2EC;}
.wfbar{display:block; height:100%; border-radius:5px; background:#38E1FF;}
.wfbar.dv-bar-enter{transform-origin:left center; animation:dvbarenter .5s cubic-bezier(.4,0,.2,1);}
@keyframes dvbarenter{from{transform:scaleX(0);opacity:.25;} to{transform:scaleX(1);opacity:1;}}
.sk-daylight .wfbar{background:#4956C9;}
.wfrow.hl .wfbar{background:#FFB454; box-shadow:0 0 8px rgba(255,180,84,.7);}
.sk-daylight .wfrow.hl .wfbar{background:#B45309; box-shadow:none;}
.wfms{font:600 10px 'IBM Plex Mono',monospace; width:52px; text-align:right;}
.sk-aurora .wfms{color:#93A7C9;}
.sk-daylight .wfms{color:#6B6F7A;}
.wftotal{font:500 10.5px 'IBM Plex Mono',monospace; margin-top:4px; text-align:right;}
.sk-aurora .wftotal{color:#5E7396;} .sk-aurora .wftotal b{color:#8AE8FF;}
.sk-daylight .wftotal{color:#8A8474;} .sk-daylight .wftotal b{color:#4956C9;}

/* orbit widget: state machine on a ring */
.orbit{display:block; width:100%; max-width:280px; margin:0 auto; height:auto;}
.oring{fill:none; stroke-dasharray:3 5; stroke-width:1.4;}
.sk-aurora .oring{stroke:#25364F;}
.sk-daylight .oring{stroke:#D8D3C6;}
.odot{transition:r .25s ease;}
.sk-aurora .odot{fill:#333D49;}
.sk-daylight .odot{fill:#C9C4B8;}
.odot.cur{animation:opulse 1.6s ease-in-out infinite alternate;}
.sk-aurora .odot.cur{fill:#38E1FF; filter:drop-shadow(0 0 6px rgba(56,225,255,.7));}
.sk-daylight .odot.cur{fill:#4956C9; filter:none;}
@keyframes opulse{to{opacity:.55;}}
.olbl{font:600 9px 'IBM Plex Mono',monospace;}
.sk-aurora .olbl{fill:#55627A;} .sk-aurora .olbl.cur{fill:#B9E2F2;}
.sk-daylight .olbl{fill:#9A958A;} .sk-daylight .olbl.cur{fill:#23272E;}
.ocur{font:700 13px 'IBM Plex Mono',monospace;}
.sk-aurora .ocur{fill:#EAF2FF;}
.sk-daylight .ocur{fill:#23272E;}
.ovia{font:500 8.5px 'IBM Plex Mono',monospace;}
.sk-aurora .ovia{fill:#5E7396;}
.sk-daylight .ovia{fill:#8A8474;}

/* zoneframe widget: night-camera frame, committed dark like the scenes */
.zfbox{border-radius:8px; overflow:hidden;}
.zframe{display:block; width:100%; height:auto;}
.zone{stroke-width:2;}
.zone.armed{stroke:#4ADE80; fill:rgba(74,222,128,.10);}
.zone.ignored{stroke:#94A3B8; stroke-dasharray:5 5; fill:none; opacity:.7;}
.zone.masked{stroke:#64748B;}
.zlbl{font:600 9px 'IBM Plex Mono',monospace; fill:#7E93B8;}
.zsubject{fill:#FFB454; filter:drop-shadow(0 0 5px rgba(255,180,84,.85));}
.zverbg{opacity:.92;}
.zverbg.alert{fill:#B91C1C;}
.zverbg.suppress{fill:#334155;}
.zverbg.never-captured{fill:#0F172A; stroke:#64748B; stroke-width:1;}
.zvertext{font:700 10px 'IBM Plex Mono',monospace; fill:#F8FAFC; letter-spacing:.06em;}

/* pir widget: IR/PIR sensor field-of-view cone + subject, committed dark like
   the scenes/zoneframe (a sensor's-eye view, not a themed surface) */
.pirbox{border-radius:8px; overflow:hidden;}
.pirframe{display:block; width:100%; height:auto;}
.pirbg{fill:#0A0F14;}
.pirground{fill:#131A21;}
.pirpath{fill:none; stroke:#334155; stroke-width:2; stroke-dasharray:4 5;}
.pircone{stroke-width:1.5;}
.pircone.clear{fill:rgba(94,115,150,.13); stroke:#5E7396; stroke-dasharray:6 4;}
.pircone.tripped{fill:rgba(255,180,84,.20); stroke:#FFB454;}
.pirsensor{fill:#38E1FF; filter:drop-shadow(0 0 4px rgba(56,225,255,.85));}
.pirsensorlbl{font:600 9px 'IBM Plex Mono',monospace; fill:#8AE8FF;}
.pirsubject{stroke:#0A0F14; stroke-width:1.5;}
.pirsubject.clear{fill:#94A3B8;}
.pirsubject.tripped{fill:#FFB454; filter:drop-shadow(0 0 5px rgba(255,180,84,.9));}
.pirstatusbg{opacity:.92;}
.pirstatusbg.clear{fill:#334155;}
.pirstatusbg.tripped{fill:#B45309;}
.pirstatustext{font:700 10px 'IBM Plex Mono',monospace; fill:#F8FAFC; letter-spacing:.05em;}
.pirbannerbg{fill:#0F172A; opacity:.9;}
.pirbannertext{font:700 10px 'IBM Plex Mono',monospace; fill:#F8FAFC; letter-spacing:.04em;}
/* pir motion: the engine emits the sweep/ping/ghost/trail/ripple elements only
   when reduced motion is off; these rules are the belt to that suspender.
   The subject carries an inline offset transform back to its previous
   position, released one frame later, so this transition makes it glide. */
.pirsubject{transition:transform .7s cubic-bezier(.4,0,.2,1);}
.pircone.clear{animation:pirbreathe 3.4s ease-in-out infinite alternate;}
@keyframes pirbreathe{to{opacity:.6;}}
.pircone.tripped.fresh{animation:pirconeflash .6s ease-out;}
@keyframes pirconeflash{from{fill:rgba(255,180,84,.5);}}
.pirsweep line{stroke:#38E1FF; stroke-width:1.2; opacity:.28; stroke-linecap:round;}
.pirsweep.tripped line{stroke:#FFB454; opacity:.4;}
.pirsweep{transform-box:view-box; animation:pirsweep 2.8s ease-in-out infinite alternate;}
@keyframes pirsweep{from{transform:rotate(calc(var(--sw) * -1));} to{transform:rotate(var(--sw));}}
.pirping{fill:none; stroke:#38E1FF; stroke-width:1.2; animation:pirping 2.4s ease-out infinite;}
.pirping.p2{animation-delay:1.2s;}
@keyframes pirping{from{r:4; opacity:.6;} to{r:18; opacity:0;}}
.pirghost{fill:#94A3B8; animation:pirfade 1.3s ease-out forwards;}
.pirtrail{stroke:#94A3B8; stroke-width:1.5; stroke-dasharray:3 4; animation:pirfade 1.3s ease-out forwards;}
@keyframes pirfade{from{opacity:.4;} to{opacity:0;}}
.pirripple{fill:none; stroke:#FFB454; stroke-width:2; animation:pirripple 1s ease-out both;}
@keyframes pirripple{from{r:6; opacity:.85;} to{r:26; opacity:0;}}
.pirstatusbg.tripped.fresh{animation:ledpulse .3s ease-in-out 4 alternate;}

/* thermo widget: a temperature readout against warning / critical shutdown
   thresholds — numeric readout + zone chip, a threshold track (shaded warn/
   crit bands, tick marks, animated value fill), and a per-step history
   sparkline revealed up to the current step */
.thhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px;}
.thval{font:700 20px 'IBM Plex Mono',monospace;}
.thunit{font-size:11px; font-weight:500; opacity:.6; margin-left:3px;}
.sk-aurora .thval{color:#EAF2FF;}
.sk-daylight .thval{color:#23272E;}
.sk-aurora .thval.z-warn{color:#FFB454;}
.sk-daylight .thval.z-warn{color:#B0771A;}
.sk-aurora .thval.z-crit{color:#FF6B5E;}
.sk-daylight .thval.z-crit{color:#B91C1C;}
.thval.z-na{opacity:.4;}
.thzone{font:700 9.5px 'IBM Plex Mono',monospace; letter-spacing:.08em; padding:3px 8px; border-radius:6px; border:1px solid transparent; white-space:nowrap;}
.sk-aurora .thzone.z-ok{color:#4ADE80; border-color:#1E4A33; background:#0C2418;}
.sk-daylight .thzone.z-ok{color:#0E7A3C; border-color:#BFE3CC; background:#EAF7EF;}
.sk-aurora .thzone.z-warn{color:#FFB454; border-color:#5A431C; background:#2A2010;}
.sk-daylight .thzone.z-warn{color:#B0771A; border-color:#EAD9B0; background:#FBF3E0;}
.sk-aurora .thzone.z-crit{color:#FF6B5E; border-color:#5F2320; background:#2C1210;}
.sk-daylight .thzone.z-crit{color:#B91C1C; border-color:#EFC4C0; background:#FBEBEA;}
.thzone.z-crit{animation:ledpulse .6s ease-in-out infinite alternate;}
.sk-aurora .thzone.z-na{color:#55627A; border-color:#1D2A40; background:#101A2C;}
.sk-daylight .thzone.z-na{color:#9A958A; border-color:#E0DCD1; background:#F4F2EC;}
.thbar{position:relative; height:10px; border-radius:5px; overflow:hidden;}
.sk-aurora .thbar{background:#101A2C;}
.sk-daylight .thbar{background:#F4F2EC;}
.thband{position:absolute; top:0; bottom:0;}
.thband.warn{background:rgba(255,180,84,.14);}
.thband.crit{background:rgba(255,107,94,.18);}
.sk-daylight .thband.warn{background:rgba(176,119,26,.12);}
.sk-daylight .thband.crit{background:rgba(185,28,28,.12);}
.thfill{position:absolute; top:0; bottom:0; left:0; border-radius:5px; transition:width .6s cubic-bezier(.4,0,.2,1);}
.sk-aurora .thfill.z-ok{background:#4ADE80;}
.sk-daylight .thfill.z-ok{background:#0E9382;}
.thfill.z-warn{background:#FFB454;}
.sk-daylight .thfill.z-warn{background:#B0771A;}
.thfill.z-crit{background:#FF6B5E; box-shadow:0 0 8px rgba(255,107,94,.7);}
.sk-daylight .thfill.z-crit{background:#B91C1C; box-shadow:none;}
.thtick{position:absolute; top:0; bottom:0; width:2px;}
.thtick.warn{background:#FFB454;}
.thtick.crit{background:#FF6B5E;}
.sk-daylight .thtick.warn{background:#B0771A;}
.sk-daylight .thtick.crit{background:#B91C1C;}
.thscale{position:relative; height:13px; margin-top:3px; font:600 8.5px 'IBM Plex Mono',monospace;}
.thscale span{position:absolute; top:1px;}
.thscale .lo{left:0;}
.thscale .hi{right:0;}
.thscale .warn, .thscale .crit{transform:translateX(-50%);}
.sk-aurora .thscale{color:#55627A;}
.sk-daylight .thscale{color:#9A958A;}
.sk-aurora .thscale .warn{color:#FFB454;} .sk-aurora .thscale .crit{color:#FF6B5E;}
.sk-daylight .thscale .warn{color:#B0771A;} .sk-daylight .thscale .crit{color:#B91C1C;}
.thspark{display:block; width:100%; height:auto; margin-top:6px;}
.thguide{stroke-width:1; stroke-dasharray:3 4;}
.thguide.warn{stroke:rgba(255,180,84,.45);}
.thguide.crit{stroke:rgba(255,107,94,.45);}
.sk-daylight .thguide.warn{stroke:rgba(176,119,26,.45);}
.sk-daylight .thguide.crit{stroke:rgba(185,28,28,.45);}
.thline{fill:none; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round;}
.sk-aurora .thline{stroke:#38E1FF;}
.sk-daylight .thline{stroke:#4956C9;}
.thline.ghost{opacity:.18;}
.thdot{opacity:.25;}
.thdot.on{opacity:1;}
.sk-aurora .thdot.z-ok{fill:#4ADE80;} .sk-daylight .thdot.z-ok{fill:#0E9382;}
.thdot.z-warn{fill:#FFB454;} .sk-daylight .thdot.z-warn{fill:#B0771A;}
.thdot.z-crit{fill:#FF6B5E;} .sk-daylight .thdot.z-crit{fill:#B91C1C;}
.sk-aurora .thdot.cur{filter:drop-shadow(0 0 4px rgba(56,225,255,.8));}
.thdot.cur.z-crit{filter:drop-shadow(0 0 5px rgba(255,107,94,.9)); animation:ledpulse .6s ease-in-out infinite alternate;}

/* battery widget: charge level where LOW is bad — readout + zone chip, a
   battery glyph (shell + nub + zone-colored fill + threshold ticks), a fixed
   context row (source / trend / forecast note), and a per-step sparkline */
.bthead{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px;}
.btval{font:700 20px 'IBM Plex Mono',monospace;}
.btunit{font-size:11px; font-weight:500; opacity:.6; margin-left:3px;}
.btbolt{font-size:13px; margin-left:5px;}
.btcold{font-size:12px; margin-left:4px; opacity:.85;}
.sk-aurora .btval{color:#EAF2FF;}
.sk-daylight .btval{color:#23272E;}
.sk-aurora .btval.z-low{color:#FFB454;}
.sk-daylight .btval.z-low{color:#B0771A;}
.sk-aurora .btval.z-crit{color:#FF6B5E;}
.sk-daylight .btval.z-crit{color:#B91C1C;}
.btval.z-na{opacity:.4;}
.btzone{font:700 9.5px 'IBM Plex Mono',monospace; letter-spacing:.08em; padding:3px 8px; border-radius:6px; border:1px solid transparent; white-space:nowrap;}
.sk-aurora .btzone.z-ok{color:#4ADE80; border-color:#1E4A33; background:#0C2418;}
.sk-daylight .btzone.z-ok{color:#0E7A3C; border-color:#BFE3CC; background:#EAF7EF;}
.sk-aurora .btzone.z-low{color:#FFB454; border-color:#5A431C; background:#2A2010;}
.sk-daylight .btzone.z-low{color:#B0771A; border-color:#EAD9B0; background:#FBF3E0;}
.sk-aurora .btzone.z-crit{color:#FF6B5E; border-color:#5F2320; background:#2C1210;}
.sk-daylight .btzone.z-crit{color:#B91C1C; border-color:#EFC4C0; background:#FBEBEA;}
.btzone.z-crit{animation:ledpulse .6s ease-in-out infinite alternate;}
.sk-aurora .btzone.z-na{color:#55627A; border-color:#1D2A40; background:#101A2C;}
.sk-daylight .btzone.z-na{color:#9A958A; border-color:#E0DCD1; background:#F4F2EC;}
.btglyph{display:flex; align-items:center; gap:2px;}
.btshell{position:relative; flex:1; height:14px; border-radius:4px; overflow:hidden; border:1.5px solid;}
.sk-aurora .btshell{background:#101A2C; border-color:#2B3B55;}
.sk-daylight .btshell{background:#F4F2EC; border-color:#C9C4B8;}
.btnub{width:4px; height:7px; border-radius:0 2px 2px 0;}
.sk-aurora .btnub{background:#2B3B55;}
.sk-daylight .btnub{background:#C9C4B8;}
.btfill{position:absolute; top:0; bottom:0; left:0; transition:width .6s cubic-bezier(.4,0,.2,1);}
.sk-aurora .btfill.z-ok{background:#4ADE80;}
.sk-daylight .btfill.z-ok{background:#0E9382;}
.btfill.z-low{background:#FFB454;}
.sk-daylight .btfill.z-low{background:#B0771A;}
.btfill.z-crit{background:#FF6B5E; box-shadow:0 0 8px rgba(255,107,94,.7);}
.sk-daylight .btfill.z-crit{background:#B91C1C; box-shadow:none;}
.bttick{position:absolute; top:0; bottom:0; width:2px;}
.bttick.low{background:#FFB454;}
.bttick.crit{background:#FF6B5E;}
.sk-daylight .bttick.low{background:#B0771A;}
.sk-daylight .bttick.crit{background:#B91C1C;}
.btctx{display:flex; align-items:baseline; gap:10px; margin-top:5px; height:15px; overflow:hidden;
  font:600 9.5px 'IBM Plex Mono',monospace; letter-spacing:.05em;}
.sk-aurora .btctx{color:#5E7396;}
.sk-daylight .btctx{color:#8A8474;}
.btsrc{min-width:44px;}
.sk-aurora .btsrc{color:#8AE8FF;}
.sk-daylight .btsrc{color:#4956C9;}
.btnote{margin-left:auto; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;}
.btspark{display:block; width:100%; height:auto; margin-top:6px;}
.btguide{stroke-width:1; stroke-dasharray:3 4;}
.btguide.low{stroke:rgba(255,180,84,.45);}
.btguide.crit{stroke:rgba(255,107,94,.45);}
.sk-daylight .btguide.low{stroke:rgba(176,119,26,.45);}
.sk-daylight .btguide.crit{stroke:rgba(185,28,28,.45);}
.btline{fill:none; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round;}
.sk-aurora .btline{stroke:#38E1FF;}
.sk-daylight .btline{stroke:#4956C9;}
.btline.ghost{opacity:.18;}
.btdot{opacity:.25;}
.btdot.on{opacity:1;}
.sk-aurora .btdot.z-ok{fill:#4ADE80;} .sk-daylight .btdot.z-ok{fill:#0E9382;}
.btdot.z-low{fill:#FFB454;} .sk-daylight .btdot.z-low{fill:#B0771A;}
.btdot.z-crit{fill:#FF6B5E;} .sk-daylight .btdot.z-crit{fill:#B91C1C;}
.sk-aurora .btdot.cur{filter:drop-shadow(0 0 4px rgba(56,225,255,.8));}
.btdot.cur.z-crit{filter:drop-shadow(0 0 5px rgba(255,107,94,.9)); animation:ledpulse .6s ease-in-out infinite alternate;}

/* radar widget: top-down range view, committed dark like pir/zoneframe —
   wedge rings, threshold arc, zone polygons, engine-derived track, subject */
.rdbox{border-radius:8px; overflow:hidden;}
.rdframe{display:block; width:100%; height:auto;}
.rdbg{fill:#0A0F14;}
.rdring{fill:none; stroke:#22314A; stroke-width:1.2;}
.rdedge{stroke:#22314A; stroke-width:1.2;}
.rdthresh{fill:none; stroke:#FFB454; stroke-width:1.5; stroke-dasharray:5 4;}
.rdzone{fill:rgba(94,115,150,.08); stroke:#3B4A63; stroke-width:1.2; stroke-dasharray:4 4;}
.rdzone.occ{fill:rgba(56,225,255,.14); stroke:#38E1FF; stroke-dasharray:none;}
.rdzlbl{font:600 9px 'IBM Plex Mono',monospace; fill:#55627A;}
.rdzlbl.occ{fill:#8AE8FF;}
.rdsweep line{stroke:#38E1FF; stroke-width:1.2; opacity:.28; stroke-linecap:round;}
.rdsweep{transform-box:view-box; animation:pirsweep 3.2s ease-in-out infinite alternate;}
.rdsensor{fill:#38E1FF; filter:drop-shadow(0 0 4px rgba(56,225,255,.85));}
.rdtrack{fill:none; stroke:#5E7396; stroke-width:1.2; stroke-dasharray:2 4;}
.rdtrackdot{fill:#5E7396;}
.rdsubject{stroke:#0A0F14; stroke-width:1.5; transition:transform .7s cubic-bezier(.4,0,.2,1);}
.rdsubject.clear{fill:#94A3B8;}
.rdsubject.alert{fill:#FFB454; filter:drop-shadow(0 0 5px rgba(255,180,84,.9));}
.rdripple{fill:none; stroke:#FFB454; stroke-width:2; animation:pirripple 1s ease-out both;}
.rdstatusbg{opacity:.92;}
.rdstatusbg.clear{fill:#334155;}
.rdstatusbg.alert{fill:#B45309;}
.rdstatusbg.alert.fresh{animation:ledpulse .3s ease-in-out 4 alternate;}
.rdstatustext{font:700 10px 'IBM Plex Mono',monospace; fill:#F8FAFC; letter-spacing:.05em;}
.rdbannerbg{fill:#0F172A; opacity:.9;}
.rdbannertext{font:700 10px 'IBM Plex Mono',monospace; fill:#F8FAFC; letter-spacing:.04em;}

/* Whole-home map uses the surrounding skin's device palette. */
.hmframe{display:block; width:100%; height:auto; border-radius:8px; overflow:hidden;
  --hm-bg:#0A0F14; --hm-line:#3B4A63; --hm-neutral:#94A3B8; --hm-accent:#38E1FF;
  --hm-ok:#43D98B; --hm-warn:#FFB454; --hm-alert:#FF6B5E; --hm-label:#93A7C9;
  background:var(--hm-bg);}
.sk-daylight .hmframe{--hm-bg:#F4F2EC; --hm-line:#C9CDE9; --hm-neutral:#6B6F7A;
  --hm-accent:#4956C9; --hm-ok:#278A52; --hm-warn:#B7791F; --hm-alert:#C93D35; --hm-label:#4F5964;}
body.sk-editorial .hmframe{--hm-bg:var(--ed-sheet); --hm-line:var(--ed-rule-strong); --hm-neutral:var(--ed-muted);
  --hm-accent:var(--ed-accent); --hm-ok:var(--ed-good); --hm-warn:var(--ed-warn); --hm-alert:var(--ed-bad); --hm-label:var(--ed-text);}
body.sk-terminal .hmframe{--hm-bg:var(--tm-ground); --hm-line:var(--tm-line); --hm-neutral:var(--tm-muted);
  --hm-accent:var(--tm-good); --hm-ok:var(--tm-good); --hm-warn:#FFD166; --hm-alert:var(--tm-alert); --hm-label:var(--tm-text);}
body.sk-pastel .hmframe{--hm-bg:#F5F7FB; --hm-line:#9BA6B5; --hm-neutral:#7D899C;
  --hm-accent:#6E7DD2; --hm-ok:#347A55; --hm-warn:#946B20; --hm-alert:#B54646; --hm-label:#526077;}
body.sk-blueprint .hmframe{--hm-bg:#031B3A; --hm-line:#94BCD5; --hm-neutral:#94BCD5;
  --hm-accent:#58E7FF; --hm-ok:#7BF5B4; --hm-warn:#FFD58A; --hm-alert:#FFB4B4; --hm-label:#D5E9F7;}
.hmframe{--hm-surface:color-mix(in srgb,var(--hm-bg) 94%,white);
  background:radial-gradient(ellipse at 30% 10%,color-mix(in srgb,var(--hm-accent) 8%,transparent),transparent 65%),var(--hm-bg);}
body.sk-pastel .hmframe,.sk-daylight .hmframe{--hm-surface:#FFFFFF;}
.hmfoundation{fill:var(--hm-line);opacity:.16;}
.hmoutline{fill:var(--hm-surface);stroke:color-mix(in srgb,var(--hm-line) 55%,var(--hm-surface));stroke-width:1.3;}
.hmdevice-aura{fill:currentColor;opacity:.08;transform-box:fill-box;transform-origin:center;}
.hm-scan .hmdevice-aura,.hm-rx .hmdevice-aura{animation:hmbreathe 3.5s ease-in-out infinite;}
.hm-detect .hmdevice-aura,.hm-alert .hmdevice-aura,.hm-warn .hmdevice-aura{animation:hmbreathe 2.2s ease-in-out infinite;}
@keyframes hmbreathe{0%,100%{opacity:.07;transform:scale(.92);}50%{opacity:.2;transform:scale(1.2);}}
.hmdev{color:var(--hm-neutral);}
.hmdev.hm-ok{color:var(--hm-ok);}
.hmdev.hm-scan,.hmdev.hm-open,.hmdev.hm-rx,.hmdev.hm-tx,.hmdev.hm-rec{color:var(--hm-accent);}
.hmdev.hm-warn{color:var(--hm-warn);}
.hmdev.hm-detect,.hmdev.hm-alert{color:var(--hm-alert);}
.hmdev.hm-sleep .hmmarker{opacity:.45;}
.hmdev.hm-off .hmmarker,.hmdev.hm-off .hmicon{opacity:.2;}
.hmmarker{fill:var(--hm-surface);stroke:currentColor;stroke-width:1.2;filter:drop-shadow(0 1px 1px color-mix(in srgb,var(--hm-line) 25%,transparent));}
.hm-off .hmdevice-aura,.hm-sleep .hmdevice-aura{display:none;}
.hm-sleep .hmdeviceglyph{opacity:.45;}
.hmsubject{color:var(--hm-accent); transition:transform .7s cubic-bezier(.4,0,.2,1);}
.hmsubjectdot{fill:currentColor;stroke:var(--hm-surface);stroke-width:1.2;}
.hmactor-icon{fill:var(--hm-surface);color:var(--hm-surface);stroke:none;pointer-events:none;}
.hmactor-shadow{fill:var(--hm-label);opacity:.12;}
.hmtrail{fill:none;stroke:var(--hm-accent);stroke-width:1.4;stroke-dasharray:2 3;stroke-linecap:round;pointer-events:none;animation:hmtrailfade 1.2s ease-out both;}
@keyframes hmtrailfade{0%,20%{opacity:.6;}100%{opacity:0;}}
.hmhubring,.hmentry{fill:none; stroke:currentColor; stroke-width:1.1;}
/* hub tx: two staggered waves loop for as long as the state holds */
.hmtxring{fill:none; stroke:currentColor; stroke-width:1.4; animation:hmtxwave 1.4s ease-out infinite;}
.hmtxring.hmtxring2{animation-delay:.7s;}
@keyframes hmtxwave{from{r:8; opacity:.9;} to{r:24; opacity:0;}}
/* camera rec: blinking recording light; under reduced motion it stays
   solid so the state is still readable */
.hmrecdot{fill:var(--hm-alert); animation:hmrecblink 1.1s steps(1) infinite;}
@keyframes hmrecblink{0%{opacity:1;} 55%{opacity:.15;} 100%{opacity:1;}}
.hmentry{stroke-linejoin:round;}
.hmdoorleaf{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;transform-box:view-box;}
.hm-open .hmdoorleaf{transform:rotate(-65deg);}
.hmdoor-opening{animation:hmdooropen .6s cubic-bezier(.2,.7,.2,1) both;}
.hmdoor-closing{animation:hmdoorclose .6s cubic-bezier(.2,.7,.2,1) both;}
@keyframes hmdooropen{from{transform:rotate(0);}to{transform:rotate(-65deg);}}
@keyframes hmdoorclose{from{transform:rotate(-65deg);}to{transform:rotate(0);}}
.hmicon{fill:none; stroke:currentColor; stroke-width:1.5;}
.hmlbl{font:600 6.8px 'IBM Plex Sans',system-ui,sans-serif;fill:var(--hm-label);
  paint-order:stroke;stroke:var(--hm-surface);stroke-width:2;stroke-linejoin:round;}
.hmwedge{fill:currentColor;fill-opacity:.1;stroke:currentColor;stroke-opacity:.22;stroke-width:.7;}
.hmsweep{transform-box:view-box; animation:pirsweep 3.2s ease-in-out infinite alternate;}
.hmsweep line{stroke:currentColor; stroke-width:1.2; opacity:.55; stroke-linecap:round;}
.hmripple,.hmglow{fill:none; stroke:currentColor; stroke-width:2; animation:pirripple 1s ease-out both;}
.hmglow{stroke-width:5;}
.hmsig{fill:var(--hm-surface);stroke:var(--hm-accent);stroke-width:1.2;filter:drop-shadow(0 0 2px var(--hm-accent)); visibility:hidden; transform-box:view-box;
  animation:hmsignal 1.6s linear infinite;}
/* travel for 45% of the cycle (~.72s, the old one-shot speed), then rest
   hidden — repeating while the step stays painted, so the relay is visible
   whenever the reader looks */
@keyframes hmsignal{
  0%{visibility:visible; opacity:1; transform:translate(var(--hx1),var(--hy1));}
  44%{visibility:visible; opacity:1;}
  45%{visibility:hidden; opacity:0; transform:translate(var(--hx2),var(--hy2));}
  100%{visibility:hidden; opacity:0; transform:translate(var(--hx2),var(--hy2));}
}

/* tiles widget: device-fleet grid — label, state chip, sub-line per tile */
.tlgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); gap:7px;}
.tltile{display:flex; flex-direction:column; gap:3px; padding:7px 8px; border-radius:8px;}
.sk-aurora .tltile{background:#101A2C; border:1px solid #1D2A40;}
.sk-daylight .tltile{background:#F4F2EC; border:1px solid #E0DCD1;}
.tltile.dim{opacity:.55;}
.tllabel{font:600 9.5px 'IBM Plex Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sk-aurora .tllabel{color:#93A7C9;}
.sk-daylight .tllabel{color:#6B6F7A;}
.tlstate{font:700 9.5px 'IBM Plex Mono',monospace; letter-spacing:.06em; align-self:flex-start;
  padding:1px 6px; border-radius:5px; border:1px solid;}
.sk-aurora .tlstate{color:#55627A; border-color:#1D2A40;}
.sk-daylight .tlstate{color:#9A958A; border-color:#E0DCD1;}
.tlsub{font:500 9px 'IBM Plex Mono',monospace; height:12px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.sk-aurora .tlsub{color:#5E7396;}
.sk-daylight .tlsub{color:#8A8474;}

/* signal widget: link-health rows — transport tag, label, 4-bar glyph,
   state chip, note; row tint follows the link state */
.sgrows{display:flex; flex-direction:column; gap:7px;}
.sgrow{display:flex; align-items:center; gap:8px; font:600 10px 'IBM Plex Mono',monospace;}
.sgtag{min-width:52px; letter-spacing:.06em;}
.sk-aurora .sgtag{color:#5E7396;}
.sk-daylight .sgtag{color:#8A8474;}
.sglabel{min-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sk-aurora .sglabel{color:#93A7C9;}
.sk-daylight .sglabel{color:#6B6F7A;}
.sgbars{display:flex; align-items:flex-end; gap:2px; height:12px;}
.sgbar{width:4px; border-radius:1px;}
.sgbar.b1{height:4px;} .sgbar.b2{height:7px;} .sgbar.b3{height:10px;} .sgbar.b4{height:12px;}
.sk-aurora .sgbar{background:#22314A;}
.sk-daylight .sgbar{background:#E0DCD1;}
.sgrow.s-ok .sgbar.on{background:#4ADE80;}
.sgrow.s-weak .sgbar.on{background:#FFB454;}
.sgrow.s-retrying .sgbar.on{background:#A78BFA; animation:ledpulse .6s ease-in-out infinite alternate;}
.sgrow.s-lost .sgbar.on, .sgrow.s-jammed .sgbar.on{background:#FF6B5E;}
.sgstate{min-width:64px; letter-spacing:.07em; font-weight:700;}
.sgrow.s-ok .sgstate{color:#4ADE80;}
.sgrow.s-weak .sgstate{color:#FFB454;}
.sgrow.s-retrying .sgstate{color:#A78BFA;}
.sgrow.s-lost .sgstate{color:#FF6B5E;}
.sgrow.s-jammed .sgstate{color:#FF6B5E; animation:ledpulse .35s ease-in-out infinite alternate;}
.sk-daylight .sgrow.s-ok .sgstate{color:#0E7A3C;}
.sk-daylight .sgrow.s-weak .sgstate{color:#B0771A;}
.sk-daylight .sgrow.s-retrying .sgstate{color:#7C5CC4;}
.sk-daylight .sgrow.s-lost .sgstate, .sk-daylight .sgrow.s-jammed .sgstate{color:#B91C1C;}
.sgnote{margin-left:auto; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%;}
.sk-aurora .sgnote{color:#5E7396;}
.sk-daylight .sgnote{color:#8A8474;}

/* buffer widget: segmented buffer strip — write-head marker row, cell row
   colored by state, computed summary + capacity, fixed-height note line */
.bfhead{display:flex; gap:3px; height:11px;}
.bfmark{flex:1; text-align:center; font-size:8px; line-height:11px; visibility:hidden;}
.bfmark.on{visibility:visible; animation:bfhead 1.1s ease-in-out infinite alternate;}
.sk-aurora .bfmark.on{color:#8AE8FF;}
.sk-daylight .bfmark.on{color:#4956C9;}
@keyframes bfhead{to{transform:translateY(2px); opacity:.55;}}
.bfrow{display:flex; gap:3px;}
.bfcell{flex:1; height:16px; border-radius:3px; border:1px solid transparent;}
.sk-aurora .bfcell.s-empty{background:#101A2C; border-color:#1D2A40;}
.sk-daylight .bfcell.s-empty{background:#F4F2EC; border-color:#E0DCD1;}
.bfcell.s-buffered{background:#38E1FF;}
.sk-daylight .bfcell.s-buffered{background:#4956C9;}
.bfcell.s-protected{background:#FFB454;}
.sk-daylight .bfcell.s-protected{background:#B0771A;}
.bfcell.s-uploading{background:#A78BFA; animation:ledpulse .7s ease-in-out infinite alternate;}
.sk-daylight .bfcell.s-uploading{background:#7C5CC4;}
.bfcell.s-uploaded{background:#4ADE80; opacity:.55;}
.sk-daylight .bfcell.s-uploaded{background:#0E9382; opacity:.55;}
.bfcell.s-dropped{background:#FF6B5E; opacity:.7;}
.sk-daylight .bfcell.s-dropped{background:#B91C1C; opacity:.7;}
.bffoot{display:flex; justify-content:space-between; gap:8px; margin-top:5px;
  font:600 9.5px 'IBM Plex Mono',monospace; letter-spacing:.05em;}
.sk-aurora .bffoot{color:#5E7396;}
.sk-daylight .bffoot{color:#8A8474;}
.sk-aurora .bfcap{color:#8AE8FF;}
.sk-daylight .bfcap{color:#4956C9;}
.bfnote{height:15px; overflow:hidden; margin-top:2px; white-space:nowrap; text-overflow:ellipsis;
  font:500 10px 'IBM Plex Mono',monospace;}
.sk-aurora .bfnote{color:#93A7C9;}
.sk-daylight .bfnote{color:#6B6F7A;}

/* xray widget: nested encryption envelopes */
.xray{font:500 10.5px 'IBM Plex Mono',monospace;}
.xlayer{border-radius:9px; padding:7px 9px 9px;}
.xlayer + .xcore, .xlayer .xlayer, .xlayer .xcore{margin-top:6px;}
.xlayer.sealed{border:1.5px solid;}
.xlayer.open{border:1.5px dashed;}
.sk-aurora .xlayer.sealed{border-color:#3B4A63; background:rgba(16,26,44,.55);}
.sk-aurora .xlayer.open{border-color:#38E1FF; background:rgba(12,34,48,.5);}
.sk-daylight .xlayer.sealed{border-color:#C9C4B8; background:#F8F6F0;}
.sk-daylight .xlayer.open{border-color:#4956C9; background:#EEF0FB;}
.xhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.xstate{font:700 8.5px 'IBM Plex Mono',monospace; letter-spacing:.1em; padding:2px 6px; border-radius:5px;}
.sk-aurora .xlayer.sealed .xstate{background:#101A2C; color:#55627A;}
.sk-aurora .xlayer.open .xstate{background:#0C2230; color:#8AE8FF;}
.sk-daylight .xlayer.sealed .xstate{background:#EFEDE6; color:#9A958A;}
.sk-daylight .xlayer.open .xstate{background:#E2E6FA; color:#4956C9;}
.sk-aurora .xname{color:#EAF2FF;}
.sk-daylight .xname{color:#23272E;}
.xholder{font-size:9.5px; margin-left:auto;}
.sk-aurora .xholder{color:#5E7396;}
.sk-daylight .xholder{color:#8A8474;}
.xcore{font:700 10px 'IBM Plex Mono',monospace; text-align:center; padding:7px 0; border-radius:7px;}
.sk-aurora .xcore{background:#101A2C; color:#93A7C9;}
.sk-daylight .xcore{background:#F4F2EC; color:#6B6F7A;}
.xfoot{font:600 10.5px 'IBM Plex Mono',monospace; margin-top:8px;}
.sk-aurora .xfoot.yes{color:#4ADE80;} .sk-aurora .xfoot.no{color:#F87171;}
.sk-daylight .xfoot.yes{color:#0E9382;} .sk-daylight .xfoot.no{color:#B91C1C;}
.sk-aurora .xfoot b{color:#EAF2FF;}
.sk-daylight .xfoot b{color:#23272E;}

/* queue widget: mailbox — enqueue / held / dequeue */
.qtrack{display:flex; align-items:center; gap:8px;}
.qslot{flex:1; min-height:34px; border:1.5px dashed; border-radius:8px; display:flex;
  align-items:center; justify-content:center; padding:4px 8px; overflow:hidden;}
.sk-aurora .qslot{border-color:#3B4A63;}
.sk-daylight .qslot{border-color:#C9C4B8;}
.s-held .qslot{border-style:solid;}
.sk-aurora .s-held .qslot{border-color:#38E1FF;}
.sk-daylight .s-held .qslot{border-color:#4956C9;}
.qempty{font:500 10px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; opacity:.45;}
.sk-aurora .qempty{color:#93A7C9;}
.sk-daylight .qempty{color:#6B6F7A;}
.qmsg{font:600 10.5px 'IBM Plex Mono',monospace; padding:4px 10px; border-radius:6px;
  border:1px solid; white-space:nowrap;}
.sk-aurora .qmsg{background:#0C2230; color:#8AE8FF; border-color:#38E1FF;}
.sk-daylight .qmsg{background:#EEF0FB; color:#4956C9; border-color:#4956C9;}
.s-enqueue .qmsg{animation:qenq .6s ease-out both;}
@keyframes qenq{from{transform:translateX(-70px); opacity:0;}}
.s-held .qmsg{animation:qheld 1.6s ease-in-out infinite alternate;}
@keyframes qheld{to{opacity:.55;}}
.s-dequeue .qmsg{animation:qdeq .7s ease-in both;}
@keyframes qdeq{to{transform:translateX(70px); opacity:0;}}
.qarr{font:700 12px 'IBM Plex Mono',monospace; opacity:.25;}
.sk-aurora .qarr{color:#5E7396;}
.sk-daylight .qarr{color:#9A958A;}
.s-enqueue .qarr-in{opacity:1;}
.sk-aurora .s-enqueue .qarr-in{color:#4ADE80;}
.sk-daylight .s-enqueue .qarr-in{color:#0E9382;}
.s-dequeue .qarr-out{opacity:1;}
.sk-aurora .s-dequeue .qarr-out{color:#FFB454;}
.sk-daylight .s-dequeue .qarr-out{color:#B45309;}
.qstatecap{font:600 9px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase;
  margin-top:6px; opacity:.6;}
.sk-aurora .qstatecap{color:#93A7C9;}
.sk-daylight .qstatecap{color:#6B6F7A;}

/* queue directional context: arrival label under the in-arrow, departure
   label under the out-arrow; static text (reduced-motion safe by design) */
/* fixed height so the row reserves space even when empty (panel never reflows) */
.qctx{display:flex; margin-top:5px; height:14px; overflow:hidden;}
.qside{font:600 9.5px 'IBM Plex Mono',monospace; line-height:14px; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.qside-in{margin-right:auto;}
.qside-out{margin-left:auto;}
.sk-aurora .qside-in{color:#4ADE80;}
.sk-daylight .qside-in{color:#0E9382;}
.sk-aurora .qside-out{color:#FFB454;}
.sk-daylight .qside-out{color:#B45309;}
/* the waiting-on line while held; fixed 2-line height (reserved even when
   empty) so a longer or shorter reason cannot change the panel height */
.qreason{font:500 10px 'IBM Plex Mono',monospace; margin-top:4px;
  height:28px; line-height:14px; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.sk-aurora .qreason{color:#5E7396;}
.sk-daylight .qreason{color:#8A8474;}

/* message-contract card: "on the wire" field table under a section's prose */
.ctcard{margin:10px 0 8px; border-radius:10px; padding:10px 12px 11px;}
.sk-aurora .ctcard{background:#0B1220; border:1px solid #25364F;}
.sk-daylight .ctcard{background:#FFFFFF; border:1px solid #E0DCD1;}
.cttitle{display:flex; align-items:center; justify-content:space-between; gap:10px;
  font:600 10.5px 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase;
  margin-bottom:7px;}
.cttitle .copychip{flex:none;}
.sk-aurora .cttitle{color:#5E7396;}
.sk-daylight .cttitle{color:#8A8474;}
.cttable{border-collapse:collapse; width:100%; font-size:11.5px;}
.ctrow td{padding:4px 10px 4px 6px; vertical-align:top; border-top:1px solid;}
.sk-aurora .ctrow td{border-top-color:#1A2740;}
.sk-daylight .ctrow td{border-top-color:#EFEDE6;}
.ctrow:first-child td{border-top:none;}
.ctk{font:600 11px 'IBM Plex Mono',monospace; white-space:nowrap;}
.sk-aurora .ctk{color:#8AE8FF;}
.sk-daylight .ctk{color:#4956C9;}
.ctv{font:500 11px 'IBM Plex Mono',monospace; white-space:nowrap;}
.sk-aurora .ctv{color:#EAF2FF;}
.sk-daylight .ctv{color:#23272E;}
.ctg{font:400 11.5px 'IBM Plex Sans',sans-serif;}
.sk-aurora .ctg{color:#7E93B8;}
.sk-daylight .ctg{color:#79808B;}
.ctrow.hot td{border-top-color:transparent;}
.sk-aurora .ctrow.hot td{background:rgba(255,180,84,.08);}
.sk-daylight .ctrow.hot td{background:#FFF6E4;}
.sk-aurora .ctrow.hot .ctk{color:#FFB454;}
.sk-daylight .ctrow.hot .ctk{color:#B45309;}
.ctrow.hot .ctv{font-weight:700;}
.sk-aurora .ctrow.dv-hash-target td,.sk-aurora .ctrow:focus td{background:rgba(56,225,255,.14);}
.sk-daylight .ctrow.dv-hash-target td,.sk-daylight .ctrow:focus td{background:#E8F7FB;}
.ctrow.dv-hash-target td:first-child,.ctrow:focus td:first-child{box-shadow:inset 3px 0 currentColor;}
.ctrow:focus{outline:none;}
.ctdelta{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid currentColor;border-radius:999px;
  font:700 8px/1.25 'IBM Plex Mono',monospace;letter-spacing:.03em;text-transform:uppercase;vertical-align:1px;}
.ctrow.delta-added .ctdelta{color:#2F9E57;}
.ctrow.delta-changed .ctdelta{color:#C47A16;}
.ctrow.delta-removed .ctdelta{color:#D34C4C;}
.ctrow.delta-removed .ctkey,.ctrow.delta-removed .ctv,.ctrow.delta-removed .ctg{
  text-decoration:line-through;text-decoration-thickness:1px;opacity:.72;}
.ctlink{text-decoration:none; font:700 12px 'IBM Plex Mono',monospace; margin-left:4px;}
.sk-aurora .ctlink{color:#63D9F5;}
.sk-aurora .ctlink:hover{color:#B5F0FF;}
.sk-daylight .ctlink{color:#4956C9;}
.sk-daylight .ctlink:hover{color:#2A33A0;}
.ctnote{font:400 11px 'IBM Plex Sans',sans-serif; margin-top:7px;}
.sk-aurora .ctnote{color:#5E7396;}
.sk-daylight .ctnote{color:#8A8474;}

/* lane pill on the caption line */
.lanepill{font:700 9.5px 'IBM Plex Mono',monospace; letter-spacing:.08em; padding:2px 7px;
  border-radius:999px; border:1px solid currentColor; margin-right:8px;}

/* subtle stable step id (E3) */
.stepid{font:500 10px 'IBM Plex Mono',monospace; margin-left:8px; opacity:.55;}

/* page-level source-document provenance */
.generated-from{font:500 10.5px/1.5 'IBM Plex Mono',monospace; color:var(--dfaint); margin:0 0 2px;}
.generated-from a{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px;}
.sk-aurora .generated-from a{color:#63D9F5;}
.sk-aurora .generated-from a:hover{color:#B5F0FF;}
.sk-daylight .generated-from a{color:#3B45B8;}
.sk-daylight .generated-from a:hover{color:#2A33A0;}

/* presenter mode (C1) */
.presentbtn{float:right; margin-top:4px;}
.presenting .presentbtn{position:fixed; top:10px; right:12px; z-index:9; float:none;}
.presenting .docview{max-width:1400px;}
.presenting .stepline{font-size:16px;}
.presenting .stepline b{font-size:16px;}
.presenting .tbtn:not(.presentbtn){font-size:14px; padding:7px 14px;}
.presenting .schip{width:30px; height:30px; font-size:12px;}
.presenting .doc-sub{display:none;}

/* print-only step caption list (C4) */
.printsteps{display:none;}

/* ---------- step mode: dim everything but the lit step; protocol colors stay ---------- */
.stepmode .edge.main, .stepmode .edge.retm{animation:none;} /* ties skin rules on specificity; later in sheet wins */
.dv-step-tween .edge{transition:opacity .4s ease, stroke .4s ease;}
.dv-step-tween .lbl{transition:opacity .4s ease;}
.dv-step-tween .node,.dv-step-tween .coin{transition:opacity .4s ease;}
.dv-step-tween .node .card,.dv-step-tween .coin circle{transition:fill .4s ease, stroke .4s ease;}
.dv-step-tween .node .t1{transition:fill .4s ease;}
/* Non-highlighted (dimmed) opacity in step mode. Defaults are per element
   kind; setting --dv-dim on any ancestor (e.g. the root element) overrides
   them all with one uniform alpha — tools/export_gif.py --dim-alpha uses
   exactly that. */
.stepmode .edge:not(.lit){opacity:var(--dv-dim, .25);}
.stepmode .edge.main.lit{opacity:1; animation:dash16 .8s linear infinite;}
.stepmode .edge.retm.lit{opacity:1; animation:dash20 1.2s linear infinite;}
.stepmode .halo{opacity:.04;}
.stepmode .pkt.loopdot{display:none;}
.stepmode .node:not(.lit){opacity:var(--dv-dim, .45);}
.stepmode .lbl{opacity:var(--dv-dim, .35);}
.stepmode .lbl.lit{opacity:1;}
